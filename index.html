                const permStatus = notifSupported ? Notification.permission : 'unsupported';
                let permNote = '';
                if (!notifSupported) permNote = 'הדפדפן הזה לא תומך בהתראות.';
                else if (permStatus === 'granted') permNote = 'הרשאת התראות ניתנה ✓';
                else if (permStatus === 'denied') permNote = 'ההתראות חסומות ברמת הדפדפן/המכשיר. יש לאפשר זאת ידנית בהגדרות המכשיר כדי שהתזכורות יעבדו.';
                else permNote = 'יש להפעיל את המתג כדי לאשר קבלת התראות מהדפדפן.';

                const recurringCount = new Set(DATA.events.filter(e => e.recurringId).map(e => e.recurringId)).size;

                holder.innerHTML = `
                            <div class="section-title" style="margin-top:0;">💰 תעריפים</div>
                            <div class="card">
                              <label>תעריף שעתי – משמרת במיציפי (₪)</label><input type="number" id="s_rate" value="${s.shiftHourlyRate}" step="0.1">
                              <label>מחיר שיעור פרטי כללי (₪)</label><input type="number" id="s_price" value="${s.lessonPrice}" step="5">
                              <div class="empty-note" style="padding:6px 0 0;text-align:right;">אפשר לקבוע מחיר קבוע לכל תלמיד/ה בנפרד בעמוד "תלמידים"</div>
                            </div>
                            <div class="section-title">⏱️ מרווחים</div>
                            <div class="card">
                              <label>זמן נסיעה/התארגנות בין פעילויות (דקות)</label><input type="number" id="s_buffer" value="${s.bufferMinutes}" step="5">
                            </div>
                            <div class="section-title">🔁 אירועים חוזרים</div>
                            <div class="card">
                              <div class="empty-note" style="padding:6px 0 12px;text-align:right;">${recurringCount ? recurringCount + ' סדרות אירועים חוזרים מוגדרות כרגע.' : 'עדיין לא הוגדרו אירועים חוזרים.'}</div>
                              <button class="btn btn-ghost" id="openRecurringBtn">${ICONS.repeat} ניהול אירועים חוזרים</button>
                            </div>
                            <div class="section-title">🔔 התראות ותזכורות</div>
                            <div class="card">
                              <div class="toggle-row">
                                <div><div class="t-main">תזכורות לפני פעילות</div><div class="t-sub">התראה בדפדפן/באפליקציה המותקנת לפני כל פעילות</div></div>
                                <div class="switch ${s.notificationsEnabled ? 'on' : ''}" id="s_notif"></div>
                              </div>
                              <label>כמה דקות לפני להתריע</label><input type="number" id="s_remind_min" value="${s.reminderMinutes || 60}" min="5" step="5">
                              <div class="toggle-row">
                                <div><div class="t-main">סיכום בוקר יומי</div><div class="t-sub">התראה יומית עם רשימת הפעילויות של היום</div></div>
                                <div class="switch ${s.morningSummaryEnabled ? 'on' : ''}" id="s_morning"></div>
                              </div>
                              <label>שעת סיכום בוקר</label><input type="time" id="s_morning_time" value="${s.morningSummaryTime || '07:00'}">
                              <div class="alert soft">${ICONS.bell}<div><b>סטטוס הרשאה</b>${permNote}</div></div>
                              <div class="alert soft">${ICONS.warn}<div><b>לתשומת לבך</b>התראות אלו פועלות כל עוד הדפדפן פתוח, או ברקע אם התקנת את האפליקציה למסך הבית. התראות שמגיעות גם כשהאפליקציה סגורה לחלוטין דורשות שרת דחיפה ייעודי ואינן זמינות בגרסה הזו.</div></div>
                            </div>
                            <div class="section-title">🎨 כללי</div>
                            <div class="card">
                              <div class="toggle-row"><div><div class="t-main">מצב כהה</div><div class="t-sub">עיצוב רך לעיניים בשעות החשכה</div></div>
                                <div class="switch ${s.theme === 'dark' ? 'on' : ''}" id="s_theme"></div></div>
                            </div>
                            <div class="section-title">📲 התקנה ומצב לא-מקוון</div>
                            <div class="card">
                              <div class="empty-note" style="padding:6px 0 12px;text-align:right;">התקנת האפליקציה למסך הבית מאפשרת פתיחה מהירה כמו אפליקציה רגילה, ועובדת גם עם קליטה חלשה - הנתונים יסתנכרנו אוטומטית ברגע שהאינטרנט יחזור.</div>
                             <button class="btn btn-ghost" id="installAppBtn" style="display:${isStandaloneMode() ? 'none' : 'flex'};margin-bottom:8px;">${ICONS.download} התקנת האפליקציה על המכשיר</button>
                            </div>
                            <div class="section-title">🗓️ סנכרון יומן</div>
                            <div class="card">
                              <div class="empty-note" style="padding:6px 0 12px;text-align:right;">אפשר לייצא את הלו"ז כקובץ ICS ולייבא אותו ידנית ליומן של Google / Apple.</div>
                              <button class="btn btn-ghost" id="exportIcsBtn">ייצוא ICS</button>
                            </div>
                            <div class="section-title">נתונים</div>
                            <div class="card">
                              <button class="btn btn-danger" id="resetBtn">${ICONS.trash} איפוס כל הנתונים</button>
                            </div>
                            <div class="empty-note">הנתונים נשמרים באופן פרטי בחשבון שלך בלבד 🌷</div>
                          `;
                document.getElementById('s_theme').addEventListener('click', function () {
                    this.classList.toggle('on');
                    s.theme = this.classList.contains('on') ? 'dark' : 'light';
                    applyTheme(); saveData();
                });
                ['s_rate', 's_price', 's_buffer'].forEach(id => {
                    document.getElementById(id).addEventListener('change', e => {
                        const map = { s_rate: 'shiftHourlyRate', s_price: 'lessonPrice', s_buffer: 'bufferMinutes' };
                        s[map[id]] = parseFloat(e.target.value) || 0;
                        saveData();
                    });
                });
                document.getElementById('openRecurringBtn').addEventListener('click', openRecurringManager);

                function bindNotifSwitch(elId, key) {
                    document.getElementById(elId).addEventListener('click', function () {
                        const sw = this;
                        if (!sw.classList.contains('on')) {
                            if (!notifSupported) { alert('הדפדפן הזה לא תומך בהתראות'); return; }
                            Notification.requestPermission().then(function (perm) {
                                if (perm === 'granted') {
                                    sw.classList.add('on');
                                    s[key] = true;
                                } else {
                                    s[key] = false;
                                    alert('לא ניתנה הרשאה להתראות. יש לאפשר זאת בהגדרות הדפדפן/המכשיר.');
                                }
                                saveData(); renderSettings();
                            });
                        } else {
                            sw.classList.remove('on');
                            s[key] = false;
                            saveData();
                        }
                    });
                }
                bindNotifSwitch('s_notif', 'notificationsEnabled');
                bindNotifSwitch('s_morning', 'morningSummaryEnabled');
                document.getElementById('s_remind_min').addEventListener('change', e => { s.reminderMinutes = parseInt(e.target.value) || 60; saveData(); });
                document.getElementById('s_morning_time').addEventListener('change', e => { s.morningSummaryTime = e.target.value || '07:00'; saveData(); });

                const installBtn = document.getElementById('installAppBtn');
                if (installBtn) {
                    installBtn.addEventListener('click', function () {
                        if (deferredInstallPrompt) {
                            deferredInstallPrompt.prompt();
                            deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; });
                        } else if (isIOSDevice()) {
                            alert('כדי להתקין באייפון/אייפד: לחצי על כפתור השיתוף (Share) בסרגל של ספארי, ואז "הוספה למסך הבית".');
                        } else {
                            alert('כדי להתקין: פתחי את תפריט הדפדפן (שלוש נקודות למעלה) ובחרי "התקנת אפליקציה" או "הוספה למסך הבית".');
                        }
                    });
                }

                document.getElementById('resetBtn').addEventListener('click', () => {
                    if (confirm('פעולה זו תמחק את כל האירועים, התלמידים וההגדרות. להמשיך?')) {
                        DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
                        saveData(); applyTheme(); renderAll();
                    }
                });
                document.getElementById('exportIcsBtn').addEventListener('click', exportIcs);
            }

            function exportIcs() {
                let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//הלוז של הילית//HE\r\n';
                DATA.events.forEach(ev => {
                    const { start, end } = eventRange(ev);
                    const fmt = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
                    ics += 'BEGIN:VEVENT\r\nUID:' + ev.id + '@hilit-schedule\r\nDTSTART:' + fmt(start) + '\r\nDTEND:' + fmt(end) + '\r\nSUMMARY:' + (ev.title || TYPE_META[ev.type].label) + '\r\nEND:VEVENT\r\n';
                });
                ics += 'END:VCALENDAR';
                const blob = new Blob([ics], { type: 'text/calendar' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'schedule.ics';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            /* ---------------- אפקט מיוחד ---------------- */
            let eggClicks = 0, eggLast = 0, eggBusy = false, eggTargets = [];

            const EGG_SEL = '.topbar, .segmented, .datenav > *, .holiday-banner, .daychip, .month-dow, .month-cell, .ev-card, .agenda-empty, .card, .stat, .client-card, .section-title, .fab, .bottomnav-inner';

            function eggRegisterClick() {
                if (eggBusy) return;
                const now = Date.now();
                eggClicks = (now - eggLast < 1500) ? eggClicks + 1 : 1; // עד 1.5 שנ' בין לחיצות
                eggLast = now;
                if (eggClicks >= 6) { eggClicks = 0; runEasterEgg(); }
            }

            // שלב 1: הבהוב שמתחיל איטי ומתגבר (לא יורד מ-220ms בין החלפות)
            function runEasterEgg() {
                eggBusy = true;
                const root = document.documentElement;
                let cur = root.getAttribute('data-theme'), i = 0;
                root.classList.add('egg-flash');
                (function step() {
                    cur = cur === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', cur);
                    if (++i >= 12) {
                        root.classList.remove('egg-flash');
                        applyTheme(); // חוזר למצב האמיתי של האפליקציה
                        eggCollapse();
                        return;
                    }
                    setTimeout(step, Math.max(220, 900 * Math.pow(0.85, i)));
                })();
            }

            // שלב 2: רעידה קלה ואז קריסה. מה שנמצא למטה נופל ראשון
            function eggCollapse() {
                const vh = window.innerHeight || 800;
                const all = Array.from(document.querySelectorAll(EGG_SEL)).filter(el => el.getBoundingClientRect().height > 0);
                const set = new Set(all);
                // רק האלמנט החיצוני ביותר, כדי שלא ייפול פעמיים
                eggTargets = all.filter(el => { for (let p = el.parentElement; p; p = p.parentElement) if (set.has(p)) return false; return true; });
                const tops = eggTargets.map(el => el.getBoundingClientRect().top);

                eggTargets.forEach(el => {
                    el.style.setProperty('--shake-delay', (-Math.random() * 0.2).toFixed(2) + 's');
                    el.classList.add('egg-shake');
                });

                setTimeout(() => {
                    document.body.style.overflow = 'hidden';
                    eggTargets.forEach((el, i) => {
                        const fromBottom = 1 - Math.min(Math.max(tops[i] / vh, 0), 1);
                        el.classList.remove('egg-shake');
                        el.style.setProperty('--delay', (fromBottom * 0.6 + Math.random() * 0.5).toFixed(2) + 's');
                        el.style.setProperty('--dur', (0.9 + Math.random() * 0.8).toFixed(2) + 's');
                        el.style.setProperty('--rot', ((Math.random() - 0.5) * 100).toFixed(0) + 'deg');
                        el.classList.add('egg-falling');
                    });
                    setTimeout(eggReveal, 3200);
                }, 900);
            }

            // שלב 3: הרקע נעשה שקוף לאט והסרטון מופיע מאחוריו
            function eggReveal() {
                const wrap = document.createElement('div');
                wrap.className = 'egg-video-wrap';
                wrap.innerHTML = '<video src="./us.mp4" playsinline loop controls></video>' +
                    '<div class="egg-rotate"><div class="egg-rotate-icon">📱</div><div class="egg-rotate-text">הטי את הטלפון על הצד כדי לצפות 🌸</div></div>';
                const veil = document.createElement('div');
                veil.className = 'egg-veil';
                const close = document.createElement('button');
                close.className = 'egg-close';
                close.setAttribute('aria-label', 'סגירה');
                close.textContent = '✕';
                document.body.append(wrap, veil, close);

                const v = wrap.querySelector('video');
                let ready = false;
                // בטלפון (מסך מגע) במצב אנכי - מבקשים להטות. במחשב הסרטון מתנגן ישר.
                const needRotate = () => window.matchMedia('(pointer: coarse)').matches && window.innerHeight > window.innerWidth;
                function requestVideoFullscreen() {
                    if (document.fullscreenElement || document.webkitFullscreenElement) return;
                    if (v.webkitEnterFullscreen) {           // iOS Safari - פולסקרין נייטיב לווידאו
                        try { v.webkitEnterFullscreen(); } catch (e) { /* ignore */ }
                    } else if (wrap.requestFullscreen) {      // כרום/אנדרואיד - על כל המעטפת
                        wrap.requestFullscreen().catch(() => { });
                    } else if (wrap.webkitRequestFullscreen) {
                        wrap.webkitRequestFullscreen();
                    }
                }
                function exitVideoFullscreen() {
                    if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
                    else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
                    else if (document.webkitCurrentFullScreenElement) document.webkitCancelFullScreen && document.webkitCancelFullScreen();
                }

                function syncOrientation() {
                    const rotate = needRotate();
                    wrap.classList.toggle('need-rotate', rotate);
                    if (rotate) {
                        v.pause();
                        exitVideoFullscreen();
                    } else if (ready) {
                        v.play().catch(() => { v.muted = true; v.play().catch(() => { }); });
                        requestVideoFullscreen();
                    }
                }
                syncOrientation();
                window.addEventListener('resize', syncOrientation);
                window.addEventListener('orientationchange', syncOrientation);

                requestAnimationFrame(() => requestAnimationFrame(() => veil.classList.add('gone')));
                setTimeout(() => { ready = true; syncOrientation(); }, 700);
                setTimeout(() => close.classList.add('show'), 3000);

                close.addEventListener('click', () => {
                    exitVideoFullscreen();
                    window.removeEventListener('resize', syncOrientation);
                    window.removeEventListener('orientationchange', syncOrientation);
                    v.pause();
                    wrap.remove(); veil.remove(); close.remove();
                    eggTargets.forEach(el => {
                        el.classList.remove('egg-falling', 'egg-shake');
                        ['--delay', '--dur', '--rot', '--shake-delay'].forEach(p => el.style.removeProperty(p));
                    });
                    eggTargets = [];
                    document.body.style.overflow = '';
                    eggBusy = false;
                });
            }
            /* ---------------- INIT ---------------- */
            function renderAll() {
                autoFinalizeLessons();
                updateGreeting();
                setActiveView(state.view);
                renderSchedule();
                renderClients();
                renderFinance();
                renderSettings();
                checkReminders();
            }
            updateGreeting();
            setActiveView('schedule');
        })();
    </script>
</body>
