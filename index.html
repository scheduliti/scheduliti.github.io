                if (!auth) return;
                const user = auth.currentUser;
                if (!user) return;
                sharedDocRef().set(JSON.parse(JSON.stringify(DATA)))
                    .catch(e => {
                        console.error('שגיאת שמירה ב-Firebase', e);
                        if (e.code === 'permission-denied') {
                            writeDenied = true;
                            if (!silent && !window.__writeDeniedShown) {
                                window.__writeDeniedShown = true;
                                alert('אין הרשאת עריכה בחשבון הזה (צפייה בלבד). השינוי לא נשמר.');
                            }
                        } else if (!silent) {
                            alert('השמירה נכשלה: ' + (e.message || e.code || 'שגיאה לא ידועה'));
                        }
                    });
            }

            function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

            /* ---------------- DATE HELPERS ---------------- */
            const DOW = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
            const MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
            function pad(n) { return String(n).padStart(2, '0'); }
            function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
            function shortDate(s) { const p = s.split('-'); return (+p[2]) + '.' + (+p[1]); }
            function parseDateStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
            function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
            function startOfWeek(d) { const r = new Date(d); const day = r.getDay(); return addDays(r, -day); }
            function sameDate(a, b) { return toDateStr(a) === toDateStr(b); }
            function combineDateTime(dateStr, timeStr) {
                const [h, m] = (timeStr || '00:00').split(':').map(Number);
                const d = parseDateStr(dateStr); d.setHours(h, m, 0, 0); return d;
            }
            function eventRange(ev) {
                const start = combineDateTime(ev.date, ev.startTime);
                let end = combineDateTime(ev.date, ev.endTime);
                if (end.getTime() <= start.getTime()) end = addDays(end, 1);
                return { start, end };
            }
            function money(n) { return '₪' + (Math.round(n * 100) / 100).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
            function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

            /* ---------------- STATE ---------------- */
            let state = {
                view: 'schedule',
                scheduleMode: 'day',
                selectedDate: new Date(),
                financeMonth: new Date(),
                editingEventId: null,
                editingClientId: null,
                detailClientId: null
            };

            /* ---------------- CONFLICT LOGIC ---------------- */
            function findConflicts(draftEv, excludeId) {
                const { start: ns, end: ne } = eventRange(draftEv);
                const buf = (draftEv.type !== 'personal' && draftEv.useBuffer !== false) ? DATA.settings.bufferMinutes * 60000 : 0;
                const ps = new Date(ns.getTime() - buf), pe = new Date(ne.getTime() + buf);
                return DATA.events.filter(ev => {
                    if (ev.id === excludeId) return false;
                    const { start: os, end: oe } = eventRange(ev);
                    const obuf = (ev.type !== 'personal' && ev.useBuffer !== false) ? DATA.settings.bufferMinutes * 60000 : 0;
                    const ops = new Date(os.getTime() - obuf), ope = new Date(oe.getTime() + obuf);
                    return ps.getTime() < ope.getTime() && ops.getTime() < pe.getTime();
                });
            }

            /* ---------------- RENDER: NAV / THEME ---------------- */
            function applyTheme() {
                document.documentElement.setAttribute('data-theme', DATA.settings.theme);
                document.getElementById('themeToggle').innerHTML = DATA.settings.theme === 'dark' ? ICONS.sun : ICONS.moon;
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', DATA.settings.theme === 'dark' ? '#1e1119' : '#fff4f7');
            }
            document.getElementById('themeToggle').addEventListener('click', () => {
                if (eggBusy) return;
                DATA.settings.theme = DATA.settings.theme === 'dark' ? 'light' : 'dark';
                applyTheme(); saveData(); renderSettings();
                eggRegisterClick();
            });

            const navIcons = { schedule: ICONS.calendar, clients: ICONS.users, finance: ICONS.wallet, settings: ICONS.settings };
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.querySelector('.ic').innerHTML = navIcons[btn.dataset.view];
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });
            document.getElementById('fabAdd').innerHTML = ICONS.plus;
            document.getElementById('fabAdd').addEventListener('click', () => openEventModal(null));
            document.getElementById('navPrev').innerHTML = ICONS.chevR;
            document.getElementById('navNext').innerHTML = ICONS.chevL;
            document.getElementById('finPrev').innerHTML = ICONS.chevR;
            document.getElementById('finNext').innerHTML = ICONS.chevL;
            document.querySelectorAll('.modal-close').forEach(b => b.innerHTML = ICONS.x);
            document.getElementById('addClientBtn').addEventListener('click', () => openClientModal(null));

            function setActiveView(v) {
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                const target = document.getElementById('view-' + v);
                if (target) target.classList.add('active');
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
                document.getElementById('fabAdd').style.display = (v === 'schedule') ? 'flex' : 'none';
            }

            function switchView(v) {
                state.view = v;
                setActiveView(v);
                if (v === 'clients') renderClients();
                if (v === 'finance') renderFinance();
                if (v === 'settings') renderSettings();
            }

            function updateGreeting() {
                const now = new Date();
                const h = now.getHours();
                let timeGreeting = 'ערב טוב';
                if (h < 5) timeGreeting = 'לילה טוב';
                else if (h < 12) timeGreeting = 'בוקר טוב';
                else if (h < 17) timeGreeting = 'צהריים טובים';
                else if (h < 20) timeGreeting = 'אחר הצהריים טובים';
                const displayName = OWNER_NAME;
                const custom = CUSTOM_GREETINGS[currentEmail];
                const dateStr = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
                const el = document.getElementById('greetText');
                if (el) el.innerHTML = (custom
                    ? '<span class="name">' + escapeHtml(custom) + '</span> 🌷'
                    : timeGreeting + ', <span class="name">' + escapeHtml(displayName) + '</span> 🌷') + '<span class="sub">' + escapeHtml(dateStr) + '</span>';
            }

            /* ---------------- SCHEDULE VIEW ---------------- */
            document.querySelectorAll('#scheduleSeg button').forEach(b => {
                b.addEventListener('click', () => {
                    state.scheduleMode = b.dataset.mode;
                    document.querySelectorAll('#scheduleSeg button').forEach(x => x.classList.toggle('active', x === b));
                    renderSchedule();
                });
            });
            document.getElementById('navPrev').addEventListener('click', () => shiftSchedule(1));
            document.getElementById('navNext').addEventListener('click', () => shiftSchedule(-1));
            document.getElementById('navToday').addEventListener('click', () => { state.selectedDate = new Date(); renderSchedule(); });
            function shiftSchedule(dir) {
                const m = state.scheduleMode;
                if (m === 'day') state.selectedDate = addDays(state.selectedDate, dir * -1);
                else if (m === 'week') state.selectedDate = addDays(state.selectedDate, dir * -7);
                else { const d = new Date(state.selectedDate); d.setMonth(d.getMonth() + (dir * -1)); state.selectedDate = d; }
                renderSchedule();
            }

            function renderSchedule() {
                const mode = state.scheduleMode;
                document.getElementById('weekStripHolder').innerHTML = '';
                document.getElementById('monthGridHolder').innerHTML = '';
                const label = document.getElementById('dateLabel');

                if (mode === 'day') {
                    label.textContent = DOW[state.selectedDate.getDay()] + "' " + state.selectedDate.getDate() + ' ב' + MONTHS[state.selectedDate.getMonth()];
                    renderHolidayBanner(toDateStr(state.selectedDate));
                    renderAgenda(state.selectedDate);
                } else if (mode === 'week') {
                    const wStart = startOfWeek(state.selectedDate);
                    const wEnd = addDays(wStart, 6);
                    label.textContent = wStart.getDate() + '–' + wEnd.getDate() + ' ב' + MONTHS[wEnd.getMonth()];
                    const strip = document.createElement('div'); strip.className = 'weekstrip';
                    for (let i = 0; i < 7; i++) {
                        const d = addDays(wStart, i);
                        const chip = document.createElement('button');
                        chip.className = 'daychip' + (sameDate(d, state.selectedDate) ? ' selected' : '');
                        const evs = eventsOnDate(d);
                        const holiday = getPrimaryHoliday(toDateStr(d));
                        const dotTypes = [...new Set(evs.map(e => e.type))];
                        chip.innerHTML = '<span class="dow">' + DOW[d.getDay()] + '</span><span class="num">' + d.getDate() + '</span>' +
                            (holiday
                                ? '<span class="chip-holiday" style="color:' + HOLIDAY_TYPE_META[holiday.type].color + '">' + escapeHtml(holidayLabel(holiday, true)) + '</span>'
                                : '') +
                            '<span class="dots">' + dotTypes.map(t => '<span style="background:' + TYPE_META[t].color + '"></span>').join('') + '</span>';
                        if (holiday && !sameDate(d, state.selectedDate)) {
                            chip.style.background = HOLIDAY_TYPE_META[holiday.type].bg;
                            chip.style.borderColor = HOLIDAY_TYPE_META[holiday.type].color;
                        }
                        chip.addEventListener('click', () => { state.selectedDate = d; renderSchedule(); });
                        strip.appendChild(chip);
                    }
                    document.getElementById('weekStripHolder').appendChild(strip);
                    renderHolidayBanner(toDateStr(state.selectedDate));
                    renderAgenda(state.selectedDate);
                } else {
                    const y = state.selectedDate.getFullYear(), m = state.selectedDate.getMonth();
                    label.textContent = MONTHS[m] + ' ' + y;
                    const grid = document.createElement('div'); grid.className = 'month-grid';
                    DOW.forEach(d => { const c = document.createElement('div'); c.className = 'month-dow'; c.textContent = d; grid.appendChild(c); });
                    const first = new Date(y, m, 1);
                    const gridStart = addDays(first, -first.getDay());
                    const today = new Date();
                    for (let i = 0; i < 42; i++) {
                        const d = addDays(gridStart, i);
                        const cell = document.createElement('div');
                        let cls = 'month-cell';
                        if (d.getMonth() !== m) cls += ' out';
                        if (sameDate(d, today)) cls += ' today';
                        if (sameDate(d, state.selectedDate)) cls += ' selected';
                        cell.className = cls;
                        const evs = eventsOnDate(d);
                        const dotTypes = [...new Set(evs.map(e => e.type))].slice(0, 4);
                        const holiday = getPrimaryHoliday(toDateStr(d));
                        cell.innerHTML = '<span class="mc-num">' + d.getDate() + '</span>' +
                            (holiday
                                ? '<span class="mc-holiday" style="color:' + HOLIDAY_TYPE_META[holiday.type].color + '">' + escapeHtml(holidayLabel(holiday, true)) + '</span>'
                                : '') +
                            '<span class="mc-dots">' + dotTypes.map(t => '<span style="background:' + TYPE_META[t].color + '"></span>').join('') + '</span>';
                        if (holiday && !sameDate(d, state.selectedDate)) {
                            cell.style.background = HOLIDAY_TYPE_META[holiday.type].bg;
                            cell.style.borderColor = HOLIDAY_TYPE_META[holiday.type].color;
                        }
                        cell.addEventListener('click', () => {
                            state.selectedDate = d; state.scheduleMode = 'day';
                            document.querySelectorAll('#scheduleSeg button').forEach(x => x.classList.toggle('active', x.dataset.mode === 'day'));
                            renderSchedule();
                        });
                        grid.appendChild(cell);
                    }
                    document.getElementById('monthGridHolder').appendChild(grid);
                    document.getElementById('holidayHolder').innerHTML = '';
                    document.getElementById('agendaHolder').innerHTML = '';
                }
            }

            function eventsOnDate(d) {
                return DATA.events.filter(ev => {
                    const { start, end } = eventRange(ev);
                    const dayStart = new Date(d); dayStart.setHours(0, 0, 0, 0);
                    const dayEnd = addDays(dayStart, 1);
                    return start.getTime() < dayEnd.getTime() && end.getTime() > dayStart.getTime();
                }).sort((a, b) => a.startTime.localeCompare(b.startTime));
            }

            function renderAgenda(date) {
                const holder = document.getElementById('agendaHolder');
                const evs = eventsOnDate(date);
                if (evs.length === 0) {
                    holder.innerHTML = '<div class="agenda-empty"><div class="big">🍓</div>אין תוכניות ליום הזה<br><button class="btn btn-ghost cta" id="emptyAddBtn" style="width:auto;">הוספת פעילות +</button></div>';
                    document.getElementById('emptyAddBtn').addEventListener('click', () => openEventModal(null, toDateStr(date)));
                    return;
                }
                holder.innerHTML = '';
                evs.forEach(ev => {
                    const meta = TYPE_META[ev.type] || TYPE_META.personal;
                    const conflicts = findConflicts(ev, ev.id);
                    const card = document.createElement('div');
                    card.className = 'ev-card';
                    card.style.setProperty('--c', meta.color);
                    card.style.setProperty('--cbg', meta.bg);
                    const student = ev.clientId ? DATA.clients.find(c => c.id === ev.clientId) : null;
                    let metaLine = '';
                    if (ev.type === 'lesson' && student) metaLine = student.name + (student.subject ? ' · ' + student.subject : '');
                    if (ev.type === 'shift' && ev.commission) metaLine = 'טיפים: ' + money(ev.commission);
                    let warnHtml = '';
                    if (conflicts.length) warnHtml += '<div class="ev-warn">' + ICONS.warn + ' חפיפה עם ' + conflicts.length + ' פעילות/יות</div>';
                    let recurHtml = ev.recurringId ? '<span class="ev-tag" style="background:var(--surface-2);color:var(--text-muted);margin-inline-start:6px;">' + ICONS.repeat.replace('width="14" height="14"', '') + ' חוזר</span>' : '';
                    card.innerHTML = '<div class="ev-time"><div class="t1">' + ev.startTime + '</div><div class="t2">' + ev.endTime + '</div></div>' +
                        '<div class="ev-body"><div class="ev-title-row"><span class="ev-icon">' + meta.icon + '</span><span class="ev-title">' + escapeHtml(ev.title || meta.label) + '</span></div>' +
                        (metaLine ? '<div class="ev-meta">' + escapeHtml(metaLine) + '</div>' : '') +
                        '<span class="ev-tag">' + meta.label + '</span>' + (ev.recurringId ? ' <span class="ev-tag" style="background:var(--surface-2);color:var(--text-muted);">🔁 חוזר</span>' : '') + warnHtml + '</div>';
                    card.addEventListener('click', () => openEventModal(ev.id));
                    holder.appendChild(card);
                });
            }
            function renderHolidayBanner(dateStr) {
                const holder = document.getElementById('holidayHolder');
                const hol = getPrimaryHoliday(dateStr);
                if (!hol) { holder.innerHTML = ''; return; }
                const meta = HOLIDAY_TYPE_META[hol.type];
                holder.innerHTML = '<div class="holiday-banner" style="--c:' + meta.color + ';--cbg:' + meta.bg + '">' +
                    ICONS.star + '<span>' + escapeHtml(holidayLabel(hol, false)) + ' &nbsp;•&nbsp; ' + meta.label + '</span></div>';
            }

            /* ---------------- EVENT MODAL ---------------- */
            function openEventModal(id, presetDate) {
                state.editingEventId = id;
                const ev = id ? DATA.events.find(e => e.id === id) : null;
                document.getElementById('evModalTitle').textContent = ev ? 'עריכת פעילות' : 'פעילות חדשה';
                const draft = ev ? Object.assign({}, ev) : {
                    id: null, type: 'lesson', title: '', date: presetDate || toDateStr(state.selectedDate),
                    startTime: '16:00', endTime: '17:00', useBuffer: true, notes: '',
                    clientId: '', commission: 0, price: DATA.settings.lessonPrice, recurring: false
                };
                renderEventForm(draft);
                document.getElementById('modalEvent').classList.add('open');
            }
            function closeModal(id) { document.getElementById(id).classList.remove('open'); }
            document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => closeModal(el.dataset.close)));

            function renderEventForm(draft) {
                const body = document.getElementById('evModalBody');
                const students = DATA.clients;
                body.innerHTML = `
                            <div class="type-picker" id="typePicker">
                              ${Object.keys(TYPE_META).map(t => `<button class="type-opt ${draft.type === t ? 'selected' : ''}" data-type="${t}" style="--c:${TYPE_META[t].color};--cbg:${TYPE_META[t].bg}">${TYPE_META[t].icon}<span>${TYPE_META[t].label}</span></button>`).join('')}
                            </div>
                            <label>כותרת (אופציונלי)</label>
                            <input id="f_title" value="${escapeHtml(draft.title || '')}" placeholder="${TYPE_META[draft.type].label}">
                            <div class="field-row">
                              <div><label>תאריך</label><input type="date" id="f_date" value="${draft.date}"></div>
                              <div></div>
                            </div>
                            <div class="field-row">
                              <div><label>שעת התחלה</label><input type="time" id="f_start" value="${draft.startTime}"></div>
                              <div><label>שעת סיום</label><input type="time" id="f_end" value="${draft.endTime}"></div>
                            </div>
                            <div id="typeExtra"></div>
                            <div class="toggle-row">
                              <div><div class="t-main">חסימת זמן נסיעה/התארגנות</div><div class="t-sub">${DATA.settings.bufferMinutes} דק' לפני ואחרי</div></div>
                              <div class="switch ${draft.useBuffer !== false ? 'on' : ''}" id="f_buffer"></div>
                            </div>
                            <div id="recurringBox"></div>
                            <label>הערות</label>
                            <textarea id="f_notes" rows="2" placeholder="הערות חופשיות...">${escapeHtml(draft.notes || '')}</textarea>
                            <div id="conflictBox"></div>
                            <div class="row-btns">
                              ${draft.id ? '<button class="btn btn-danger" id="delEvBtn">מחיקה</button>' : ''}
                              <button class="btn btn-primary" id="saveEvBtn">שמירה</button>
                            </div>
                          `;
                document.getElementById('f_buffer').addEventListener('click', function () { this.classList.toggle('on'); refreshConflictPreview(draft); });

                document.querySelectorAll('#typePicker .type-opt').forEach(btn => {
                    btn.addEventListener('click', () => {
                        draft.type = btn.dataset.type;
                        document.querySelectorAll('#typePicker .type-opt').forEach(b => b.classList.toggle('selected', b === btn));
                        document.getElementById('f_title').placeholder = TYPE_META[draft.type].label;
                        renderTypeExtra(draft);
                        renderRecurringBox(draft);
                        refreshConflictPreview(draft);
                    });
                });
                renderTypeExtra(draft);
                renderRecurringBox(draft);

                ['f_date', 'f_start', 'f_end'].forEach(id => document.getElementById(id).addEventListener('change', () => { updatePresetSel(); refreshConflictPreview(draft); }));
                function updatePresetSel() {
                    const st = document.getElementById('f_start').value, en = document.getElementById('f_end').value;
                    document.querySelectorAll('#shiftPresets .preset').forEach(b => b.classList.toggle('selected', b.dataset.s === st && b.dataset.e === en));
                }

                function renderRecurringBox(d) {
                    const box = document.getElementById('recurringBox');
                    // אפשרות "אירוע חוזר" זמינה רק בהוספת פעילות חדשה (לא בעריכת פעילות בודדת), ורק למשמרות/שיעורים
                    if (d.id) { box.innerHTML = ''; return; }
                    box.innerHTML = `<div class="toggle-row">
                              <div><div class="t-main">אירוע חוזר 🔁</div><div class="t-sub">כל שבוע, באותו יום ואותה שעה, למשך שנה קדימה</div></div>
                              <div class="switch ${d.recurring ? 'on' : ''}" id="f_recurring"></div>
                            </div>`;
                    document.getElementById('f_recurring').addEventListener('click', function () {
                        this.classList.toggle('on');
                        d.recurring = this.classList.contains('on');
                    });
                }

                function renderTypeExtra(d) {
                    const box = document.getElementById('typeExtra');
                    if (d.type === 'shift') {
                        box.innerHTML = `<label>משמרת מהירה (מעדכן את השעות)</label>
                              <div class="preset-row" id="shiftPresets">
                                <button type="button" class="preset" data-s="07:00" data-e="14:30">🌅 משמרת בוקר<small>07:00–14:30</small></button>
                                <button type="button" class="preset" data-s="14:00" data-e="21:30">🌙 משמרת ערב<small>14:00–21:30</small></button>
                              </div>
                              <label>טיפים / בונוס במשמרת (₪)</label><input type="number" id="f_comm" value="${d.commission || 0}" min="0" step="5">`;
                        document.querySelectorAll('#shiftPresets .preset').forEach(b => b.addEventListener('click', () => {
                            document.getElementById('f_start').value = b.dataset.s;
                            document.getElementById('f_end').value = b.dataset.e;
                            updatePresetSel();
                            refreshConflictPreview(d);
                        }));
                        updatePresetSel();
                    } else if (d.type === 'lesson') {
                        box.innerHTML = `<label>תלמיד/ה</label>
                              <select id="f_client"><option value="">— ללא שיוך —</option>${students.map(c => `<option value="${c.id}" ${d.clientId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}${c.subject ? ' (' + escapeHtml(c.subject) + ')' : ''}</option>`).join('')}</select>
                              <label>מחיר השיעור (₪)</label><input type="number" id="f_price" value="${d.price != null ? d.price : DATA.settings.lessonPrice}" min="0" step="5">`;
                        document.getElementById('f_client').addEventListener('change', function () {
                            const chosen = students.find(c => c.id === this.value);
                            const priceInput = document.getElementById('f_price');
                            if (chosen && chosen.price != null && chosen.price !== '') {
                                priceInput.value = chosen.price;
                            } else {
                                priceInput.value = DATA.settings.lessonPrice;
                            }
                        });
                    } else {
                        box.innerHTML = '';
                    }
                }

                function refreshConflictPreview(d) {
                    const test = {
                        id: d.id, type: d.type, date: document.getElementById('f_date').value,
                        startTime: document.getElementById('f_start').value, endTime: document.getElementById('f_end').value,
                        useBuffer: document.getElementById('f_buffer').classList.contains('on')
                    };
                    const box = document.getElementById('conflictBox');
                    if (!test.date || !test.startTime || !test.endTime) { box.innerHTML = ''; return; }
                    const conflicts = findConflicts(test, d.id);
                    let html = '';
                    if (conflicts.length) {
                        html += '<div class="alert">' + ICONS.warn + '<div><b>זוהתה חפיפה</b>חופפת ל' + conflicts.map(c => TYPE_META[c.type].label + ' (' + c.startTime + '–' + c.endTime + ')').join(', ') + (test.useBuffer ? ' (כולל זמן חוצץ)' : '') + '</div></div>';
                    }
                    box.innerHTML = html;
                }
                refreshConflictPreview(draft);

                document.getElementById('saveEvBtn').addEventListener('click', () => {
                    draft.title = document.getElementById('f_title').value.trim();
                    draft.date = document.getElementById('f_date').value;
                    draft.startTime = document.getElementById('f_start').value;
                    draft.endTime = document.getElementById('f_end').value;
                    draft.useBuffer = document.getElementById('f_buffer').classList.contains('on');
                    draft.notes = document.getElementById('f_notes').value.trim();
                    if (draft.type === 'shift') { draft.commission = parseFloat(document.getElementById('f_comm').value) || 0; }
                    if (draft.type === 'lesson') {
                        draft.clientId = document.getElementById('f_client').value || '';
                        const p = parseFloat(document.getElementById('f_price').value);
                        draft.price = isNaN(p) ? DATA.settings.lessonPrice : p;
                    }
                    if (!draft.date || !draft.startTime || !draft.endTime) { alert('נא למלא תאריך ושעות'); return; }
                    if (draft.id) {
                        const idx = DATA.events.findIndex(e => e.id === draft.id);
                        DATA.events[idx] = draft;
                    } else {
                        draft.id = uid();
                        if (draft.type === 'lesson') draft.status = 'scheduled';
                        if (draft.recurring) {
                            const recurringId = uid();
                            const occurrences = 52; // כל שבוע, לשנה קדימה
                            const baseDate = parseDateStr(draft.date);
                            for (let i = 0; i < occurrences; i++) {
                                const occDate = addDays(baseDate, i * 7);
                                const occ = Object.assign({}, draft, { id: (i === 0 ? draft.id : uid()), date: toDateStr(occDate), recurringId: recurringId });
                                delete occ.recurring;
                                if (occ.type === 'lesson') occ.status = 'scheduled';
                                DATA.events.push(occ);
                            }
                            saveData();
                            closeModal('modalEvent');
                            renderSchedule();
                            if (state.view === 'finance') renderFinance();
                            return;
                        }
                        delete draft.recurring;
                        DATA.events.push(draft);
                    }
                    saveData();
                    closeModal('modalEvent');
                    renderSchedule();
                    if (state.view === 'finance') renderFinance();
                });
                if (draft.id) {
                    document.getElementById('delEvBtn').addEventListener('click', () => {
                        if (confirm('למחוק את הפעילות?')) {
                            DATA.events = DATA.events.filter(e => e.id !== draft.id);
                            saveData(); closeModal('modalEvent'); renderSchedule();
                        }
                    });
                }
            }

            /* ---------------- STUDENTS ---------------- */
            function lessonsDone(c) {
                return (c.history || []).filter(h => h.status === 'attended' || h.status === 'late-cancel').length;
            }

            function renderClients() {
                const holder = document.getElementById('clientsHolder');
                if (DATA.clients.length === 0) {
                    holder.innerHTML = '<div class="agenda-empty"><div class="big">📚</div><div>עדיין אין תלמידים רשומים<br>הוספת תלמיד/ה תאפשר מעקב אחרי התקדמות ושיעורים</div></div>';
                    return;
                }
                holder.innerHTML = '';
                DATA.clients.forEach(c => {
                    const prog = Math.max(0, Math.min(100, c.progress || 0));
                    const div = document.createElement('div');
                    div.className = 'client-card';
                    const chips = (c.subject ? '<span class="chip">' + escapeHtml(c.subject) + '</span>' : '') + (c.age ? '<span class="chip soft">גיל ' + escapeHtml(c.age) + '</span>' : '');
                    div.innerHTML = `<div class="client-top">
                              <div class="avatar">${escapeHtml((c.name || '?').trim().charAt(0))}</div>
                              <div class="client-main"><div class="client-name">${escapeHtml(c.name)}</div>${chips ? '<div class="chips">' + chips + '</div>' : ''}</div>
                              <span class="pkg-pill">${lessonsDone(c)} שיעורים</span>
                            </div>
                            <div class="progress-wrap"><div class="progress"><i style="width:${prog}%"></i></div><span class="pct">${prog}%</span></div>
                            ${c.learned ? '<div class="client-goals">📖 ' + escapeHtml(c.learned) + '</div>' : ''}`;
                    div.addEventListener('click', () => openClientDetail(c.id));
                    holder.appendChild(div);
                });
            }

            function openClientModal(id) {
                state.editingClientId = id;
                const c = id ? DATA.clients.find(x => x.id === id) : null;
                document.getElementById('clModalTitle').textContent = c ? 'עריכת תלמיד/ה' : 'תלמיד/ה חדש/ה';
                const draft = c ? Object.assign({}, c) : { id: null, name: '', phone: '', subject: '', age: '', progress: 0, learned: '', notes: '', history: [], price: '' };
                document.getElementById('clModalBody').innerHTML = `
                            <label>שם מלא</label><input id="c_name" value="${escapeHtml(draft.name)}">
                            <div class="field-row">
                              <div><label>מקצוע</label><input id="c_subject" value="${escapeHtml(draft.subject || '')}" placeholder="למשל: מתמטיקה"></div>
                              <div style="flex:.6"><label>גיל</label><input id="c_age" type="number" min="1" max="99" value="${escapeHtml(draft.age || '')}"></div>
                            </div>
                            <label>טלפון (תלמיד/ה או הורה)</label><input id="c_phone" value="${escapeHtml(draft.phone || '')}" type="tel">
                            <label>מחיר קבוע לשיעור (₪) <span style="font-weight:400;">— אם לא מוגדר, ישמש המחיר הכללי מההגדרות</span></label>
                            <input id="c_price" type="number" min="0" step="5" value="${draft.price != null ? escapeHtml(draft.price) : ''}" placeholder="${DATA.settings.lessonPrice}">
                            <label>התקדמות: <b id="c_prog_val" style="color:var(--accent)">${draft.progress || 0}%</b></label>
                            <input id="c_prog" type="range" min="0" max="100" step="5" value="${draft.progress || 0}">
                            <label>מה למדו עד כה</label><textarea id="c_learned" rows="4" placeholder="נושאים, פרקים, מיומנויות שכבר נלמדו...">${escapeHtml(draft.learned || '')}</textarea>
                            <label>הערות</label><textarea id="c_notes" rows="2" placeholder="קשיים, סגנון למידה, דברים לזכור...">${escapeHtml(draft.notes || '')}</textarea>
                            <div class="row-btns">
                              ${draft.id ? '<button class="btn btn-danger" id="delClBtn">מחיקה</button>' : ''}
                              <button class="btn btn-primary" id="saveClBtn">שמירה</button>
                            </div>`;
                document.getElementById('c_prog').addEventListener('input', e => { document.getElementById('c_prog_val').textContent = e.target.value + '%'; });
                document.getElementById('saveClBtn').addEventListener('click', () => {
                    draft.name = document.getElementById('c_name').value.trim();
                    if (!draft.name) { alert('נא להזין שם'); return; }
                    draft.subject = document.getElementById('c_subject').value.trim();
                    const age = parseInt(document.getElementById('c_age').value);
                    draft.age = isNaN(age) ? '' : age;
                    draft.phone = document.getElementById('c_phone').value.trim();
                    const priceVal = document.getElementById('c_price').value;
                    draft.price = priceVal === '' ? '' : (parseFloat(priceVal) || 0);
                    draft.progress = parseInt(document.getElementById('c_prog').value) || 0;
                    draft.learned = document.getElementById('c_learned').value.trim();
                    draft.notes = document.getElementById('c_notes').value.trim();
                    draft.history = draft.history || [];
                    if (draft.id) { const idx = DATA.clients.findIndex(x => x.id === draft.id); DATA.clients[idx] = draft; }
                    else { draft.id = uid(); DATA.clients.push(draft); }
                    saveData(); closeModal('modalClient'); renderClients();
                });
                if (draft.id) {
                    document.getElementById('delClBtn').addEventListener('click', () => {
                        if (confirm('למחוק את התלמיד/ה? (השיעורים המשויכים יישארו ביומן ללא שיוך)')) {
                            DATA.clients = DATA.clients.filter(x => x.id !== draft.id);
                            DATA.events.forEach(e => { if (e.clientId === draft.id) e.clientId = ''; });
                            saveData(); closeModal('modalClient'); renderClients();
                        }
                    });
                }
                document.getElementById('modalClient').classList.add('open');
            }

            function openClientDetail(id) {
                state.detailClientId = id;
                const c = DATA.clients.find(x => x.id === id);
                if (!c) return;
                const prog = Math.max(0, Math.min(100, c.progress || 0));
                const todayStart = new Date(new Date().setHours(0, 0, 0, 0));
                const upcoming = DATA.events.filter(e => e.type === 'lesson' && e.clientId === id && e.status === 'scheduled' && parseDateStr(e.date) >= todayStart).sort((a, b) => a.date.localeCompare(b.date));
                const history = (c.history || []).slice().reverse();
                const chips = (c.subject ? '<span class="chip">' + escapeHtml(c.subject) + '</span>' : '') + (c.age ? '<span class="chip soft">גיל ' + escapeHtml(c.age) + '</span>' : '') + (c.phone ? '<span class="chip soft">' + escapeHtml(c.phone) + '</span>' : '') + (c.price != null && c.price !== '' ? '<span class="chip soft">' + money(c.price) + ' לשיעור</span>' : '');
                document.getElementById('clDetailBody').innerHTML = `
                            <div class="modal-title">${escapeHtml(c.name)}</div>
                            ${chips ? '<div class="chips" style="margin:0 0 12px;">' + chips + '</div>' : ''}
                            <div class="stat-grid" style="margin:12px 0;">
                              <div class="stat"><div class="si">✏️</div><div class="num">${lessonsDone(c)}</div><div class="lbl">שיעורים שהתקיימו</div></div>
                              <div class="stat"><div class="si">🌱</div><div class="num">${prog}%</div><div class="lbl">התקדמות</div>
                                <div class="progress" style="margin-top:8px;"><i style="width:${prog}%"></i></div></div>
                            </div>
                            ${c.learned ? '<div class="section-title">📖 מה למדו עד כה</div><div class="prose">' + escapeHtml(c.learned) + '</div>' : ''}
                            ${c.notes ? '<div class="section-title">📝 הערות</div><div class="prose">' + escapeHtml(c.notes) + '</div>' : ''}
                            <div class="section-title">שיעורים קרובים</div>
                            ${upcoming.length ? upcoming.map(e => `<div class="ev-card" style="--c:${TYPE_META.lesson.color};--cbg:${TYPE_META.lesson.bg}"><div class="ev-time"><div class="t1">${e.startTime}</div><div class="t2">${shortDate(e.date)}</div></div>
                              <div class="ev-body"><div class="ev-title">${escapeHtml(e.title || 'שיעור פרטי')}</div>
                              <div class="row-btns">
                                <button class="btn btn-ghost btn-sm" data-checkin="${e.id}">${ICONS.check} התקיים</button>
                                <button class="btn btn-danger btn-sm" data-cancel="${e.id}">ביטול</button>
                              </div></div></div>`).join('') : '<div class="empty-note">אין שיעורים עתידיים מתוזמנים</div>'}
                            <div class="section-title">היסטוריה</div>
                            ${history.length ? history.slice(0, 10).map(h => `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
                              <span>${h.date}</span><span style="font-weight:600;color:${h.status === 'attended' ? 'var(--ok)' : 'var(--danger)'}">${h.status === 'attended' ? 'התקיים' : h.status === 'late-cancel' ? 'ביטול מאוחר (מחויב)' : 'בוטל'}</span></div>`).join('') : '<div class="empty-note">אין היסטוריה עדיין</div>'}
                            <div class="row-btns">
                              <button class="btn btn-ghost" id="editClFromDetail">עריכת פרטים</button>
                            </div>
                          `;
                document.getElementById('editClFromDetail').addEventListener('click', () => { closeModal('modalClientDetail'); openClientModal(id); });
                document.querySelectorAll('[data-checkin]').forEach(b => b.addEventListener('click', () => markLesson(b.dataset.checkin, 'attended')));
                document.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => {
                    const late = confirm('האם זהו ביטול מאוחר (השיעור יחויב)? אישור = כן, ביטול = לא');
                    markLesson(b.dataset.cancel, late ? 'late-cancel' : 'cancelled');
                }));
                document.getElementById('modalClientDetail').classList.add('open');
            }
            function markLesson(eventId, status) {
                const ev = DATA.events.find(e => e.id === eventId);
                if (!ev) return;
                ev.status = status;
                const c = DATA.clients.find(x => x.id === ev.clientId);
                if (c) {
                    c.history = c.history || [];
                    c.history.push({ id: uid(), date: ev.date, status, eventId });
                }
                saveData();
                if (ev.clientId) openClientDetail(ev.clientId);
                renderClients();
                renderSchedule();
            }
            // שיעור שהסתיים ועדיין "מתוזמן" נחשב אוטומטית כשיעור שהתקיים
            function autoFinalizeLessons() {
                if (!storageReady || writeDenied) return;
                const now = new Date();
                let changed = false;
                DATA.events.forEach(ev => {
                    if (ev.type === 'lesson' && ev.status === 'scheduled') {
                        const { end } = eventRange(ev);
                        if (end.getTime() <= now.getTime()) {
                            ev.status = 'attended';
                            const c = DATA.clients.find(x => x.id === ev.clientId);
                            if (c) {
                                c.history = c.history || [];
                                c.history.push({ id: uid(), date: ev.date, status: 'attended', eventId: ev.id });
                            }
                            changed = true;
                        }
                    }
                });
                if (changed) {
                    saveDataToFirebase(true);
                    renderSchedule();
                    renderClients();
                    if (state.view === 'finance') renderFinance();
                }
            }

            /* ---------------- FINANCE ---------------- */
            document.getElementById('finPrev').addEventListener('click', () => { const d = new Date(state.financeMonth); d.setMonth(d.getMonth() - 1); state.financeMonth = d; renderFinance(); });
            document.getElementById('finNext').addEventListener('click', () => { const d = new Date(state.financeMonth); d.setMonth(d.getMonth() + 1); state.financeMonth = d; renderFinance(); });

            function shiftKindLabel(ev) {
                if (ev.startTime === '07:00' && ev.endTime === '14:30') return { label: 'משמרת בוקר', emo: '🌅' };
                if (ev.startTime === '14:00' && ev.endTime === '21:30') return { label: 'משמרת ערב', emo: '🌙' };
                return { label: 'משמרת דינמית', emo: '🥤' };
            }

            function renderFinance() {
                const y = state.financeMonth.getFullYear(), m = state.financeMonth.getMonth();
                document.getElementById('finLabel').textContent = MONTHS[m] + ' ' + y;
                const inMonth = DATA.events.filter(e => { const d = parseDateStr(e.date); return d.getFullYear() === y && d.getMonth() === m; });

                const now = new Date();
                let shiftHours = 0, tips = 0, lessonsHeld = 0, lessonsTotal = 0, lessonIncome = 0, lessonHours = 0;
                inMonth.forEach(ev => {
                    const { start, end } = eventRange(ev);
                    const hrs = (end - start) / 3600000;
                    const isDone = end.getTime() <= now.getTime();
                    if (ev.type === 'shift' && isDone) { shiftHours += hrs; tips += (ev.commission || 0); }
                    if (ev.type === 'lesson') {
                        lessonsTotal++;
                        if (ev.status === 'attended' || ev.status === 'late-cancel') {
                            lessonsHeld++;
                            lessonIncome += (ev.price != null ? ev.price : DATA.settings.lessonPrice);
                            lessonHours += hrs;
                        }
                    }
                });
                const shiftIncome = shiftHours * DATA.settings.shiftHourlyRate + tips;
                const totalIncome = shiftIncome + lessonIncome;

                document.getElementById('financeHolder').innerHTML = `
                            <div class="card hero">
                              <div class="section-title" style="margin-top:0;">סה"כ הכנסה החודש</div>
                              <div style="font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;">${money(totalIncome)}</div>
                            </div>
                            <div class="stat-grid">
                              <div class="stat" id="statShiftIncome" style="cursor:pointer;">
                                <div class="si">🥤</div><div class="num">${money(shiftIncome)}</div><div class="lbl">הכנסה ממיציפי (לחצי לפירוט)</div>
                              </div>
                              <div class="stat" id="statLessonIncome" style="cursor:pointer;">
                                <div class="si">📚</div><div class="num">${money(lessonIncome)}</div><div class="lbl">הכנסה משיעורים (לחצי לפירוט)</div>
                              </div>
                              <div class="stat"><div class="si">⏰</div><div class="num">${shiftHours.toFixed(1)}</div><div class="lbl">שעות במיציפי</div></div>
                              <div class="stat" id="statLessonsHeld" style="cursor:pointer;"><div class="si">✏️</div><div class="num">${lessonsHeld}</div><div class="lbl">שיעורים שבוצעו (לחצי לפירוט)</div></div>
                              <div class="stat"><div class="si">🎓</div><div class="num">${lessonHours.toFixed(1)}</div><div class="lbl">שעות הוראה</div></div>
                              <div class="stat"><div class="si">🍓</div><div class="num">${money(tips)}</div><div class="lbl">טיפים / בונוסים</div></div>
                            </div>
                            <div class="section-title">פילוח הכנסה</div>
                            <div class="card">
                              ${financeBar('מיציפי 🥤', shiftIncome, totalIncome || 1, 'var(--shift)', true)}
                              ${financeBar('שיעורים 📚', lessonIncome, totalIncome || 1, 'var(--lesson)', true)}
                            </div>
                            <div class="section-title">חלוקת שעות</div>
                            <div class="card">
                              ${financeBar('מיציפי 🥤', shiftHours, (shiftHours + lessonHours) || 1, 'var(--shift)', false)}
                              ${financeBar('הוראה 📚', lessonHours, (shiftHours + lessonHours) || 1, 'var(--lesson)', false)}
                            </div>
                          `;
                document.getElementById('statShiftIncome').addEventListener('click', () => openShiftFinanceDetail(y, m));
                document.getElementById('statLessonIncome').addEventListener('click', () => openLessonFinanceDetail(y, m));
                document.getElementById('statLessonsHeld').addEventListener('click', () => openLessonCountDetail(y, m));
            }
            function financeBar(label, val, total, color, isMoney) {
                const pct = val > 0 ? Math.max(2, Math.min(100, (val / total) * 100)) : 0;
                return `<div class="bar-row"><span class="lbl">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="val">${isMoney ? money(val) : val.toFixed(1) + ' שע\''}</span></div>`;
            }

            function openShiftFinanceDetail(y, m) {
                const now = new Date();
                const shifts = DATA.events.filter(e => {
                    if (e.type !== 'shift') return false;
                    const d = parseDateStr(e.date);
                    if (d.getFullYear() !== y || d.getMonth() !== m) return false;
                    const { end } = eventRange(e);
                    return end.getTime() <= now.getTime();
                }).sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));

                const byKind = {};
                let totalHours = 0, totalTips = 0, totalIncome = 0;
                shifts.forEach(ev => {
                    const { start, end } = eventRange(ev);
                    const hrs = (end - start) / 3600000;
                    const income = hrs * DATA.settings.shiftHourlyRate + (ev.commission || 0);
                    const kind = shiftKindLabel(ev);
                    if (!byKind[kind.label]) byKind[kind.label] = { emo: kind.emo, count: 0, hours: 0, tips: 0, income: 0 };
                    byKind[kind.label].count++;
                    byKind[kind.label].hours += hrs;
                    byKind[kind.label].tips += (ev.commission || 0);
                    byKind[kind.label].income += income;
                    totalHours += hrs; totalTips += (ev.commission || 0); totalIncome += income;
                });

                const summaryHtml = shifts.length ? `<div class="client-card" style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-weight:700;">🥤 כל המשמרות</div>
          <div style="font-weight:800;color:var(--accent);">${money(totalIncome)}</div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${shifts.length} משמרות · ${totalHours.toFixed(1)} שעות${totalTips ? ' · טיפים ' + money(totalTips) : ''}</div>
      </div>` : '<div class="empty-note">אין משמרות שהושלמו בחודש זה</div>';

                const listHtml = shifts.map(ev => {
                    const { start, end } = eventRange(ev);
                    const hrs = (end - start) / 3600000;
                    const income = hrs * DATA.settings.shiftHourlyRate + (ev.commission || 0);
                    const kind = shiftKindLabel(ev);
                    return `<div class="ev-card" style="--c:var(--shift);--cbg:var(--shift-bg);">
                            <div class="ev-time"><div class="t1">${ev.startTime}</div><div class="t2">${ev.endTime}</div></div>
                            <div class="ev-body">
                              <div class="ev-title-row"><span class="ev-icon"><i class="emo">${kind.emo}</i></span><span class="ev-title">${escapeHtml(kind.label)} · ${shortDate(ev.date)}</span></div>
                              <div class="ev-meta">${hrs.toFixed(1)} שעות · ${money(income)}${ev.commission ? ' (כולל טיפים ' + money(ev.commission) + ')' : ''}</div>
                            </div>
                          </div>`;
                }).join('');

                document.getElementById('finDetailBody').innerHTML = `
                        <div class="modal-title">🥤 פירוט הכנסות ממשמרות</div>
                        <div class="empty-note" style="padding:2px 0 14px;text-align:right;">${MONTHS[m]} ${y} · סה"כ ${money(totalIncome)} מתוך ${totalHours.toFixed(1)} שעות${totalTips ? ' וטיפים ' + money(totalTips) : ''}</div>
                        <div class="section-title" style="margin-top:0;">סיכום</div>
                        ${summaryHtml}
                        <div class="section-title">פירוט</div>
                        ${listHtml || '<div class="empty-note">אין משמרות שהושלמו בחודש זה</div>'}
                      `;
                document.getElementById('modalFinanceDetail').classList.add('open');
            }
            function openLessonCountDetail(y, m) {
                const held = DATA.events.filter(e => {
                    if (e.type !== 'lesson') return false;
                    if (!(e.status === 'attended' || e.status === 'late-cancel')) return false;
                    const d = parseDateStr(e.date);
                    return d.getFullYear() === y && d.getMonth() === m;
                });
                const counts = {};
                held.forEach(ev => {
                    const st = ev.clientId ? DATA.clients.find(c => c.id === ev.clientId) : null;
                    const name = st ? st.name : 'ללא שיוך';
                    counts[name] = (counts[name] || 0) + 1;
                });
                const rows = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).map(name =>
                    `<div class="client-card" style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-weight:700;">📚 ${escapeHtml(name)}</div>
            <div style="font-weight:800;color:var(--accent);">${counts[name]} שיעורים</div></div></div>`
                ).join('') || '<div class="empty-note">אין שיעורים שהתקיימו בחודש זה</div>';
                document.getElementById('finDetailBody').innerHTML =
                    `<div class="modal-title">✏️ שיעורים שבוצעו</div>
         <div class="empty-note" style="padding:2px 0 14px;text-align:right;">${MONTHS[m]} ${y} · סה"כ ${held.length} שיעורים</div>${rows}`;
                document.getElementById('modalFinanceDetail').classList.add('open');
            }

            function openLessonFinanceDetail(y, m) {
                const held = DATA.events.filter(e => {
                    if (e.type !== 'lesson') return false;
                    if (!(e.status === 'attended' || e.status === 'late-cancel')) return false;
                    const d = parseDateStr(e.date);
                    return d.getFullYear() === y && d.getMonth() === m;
                }).sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));

                const byStudent = {};
                let totalIncome = 0;
                held.forEach(ev => {
                    const price = ev.price != null ? ev.price : DATA.settings.lessonPrice;
                    const student = ev.clientId ? DATA.clients.find(c => c.id === ev.clientId) : null;
                    const name = student ? student.name : 'ללא שיוך';
                    if (!byStudent[name]) byStudent[name] = { count: 0, income: 0 };
                    byStudent[name].count++;
                    byStudent[name].income += price;
                    totalIncome += price;
                });

                const summaryHtml = Object.keys(byStudent).sort((a, b) => byStudent[b].income - byStudent[a].income).map(name => {
                    const s = byStudent[name];
                    return `<div class="client-card" style="margin-bottom:8px;">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                              <div style="font-weight:700;">📚 ${escapeHtml(name)}</div>
                              <div style="font-weight:800;color:var(--accent);">${money(s.income)}</div>
                            </div>
                            <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${s.count} שיעורים</div>
                          </div>`;
                }).join('') || '<div class="empty-note">אין שיעורים שהתקיימו בחודש זה</div>';

                const listHtml = held.map(ev => {
                    const price = ev.price != null ? ev.price : DATA.settings.lessonPrice;
                    const student = ev.clientId ? DATA.clients.find(c => c.id === ev.clientId) : null;
                    return `<div class="ev-card" style="--c:var(--lesson);--cbg:var(--lesson-bg);">
                            <div class="ev-time"><div class="t1">${ev.startTime}</div><div class="t2">${shortDate(ev.date)}</div></div>
                            <div class="ev-body">
                              <div class="ev-title-row"><span class="ev-icon"><i class="emo">📚</i></span><span class="ev-title">${escapeHtml(student ? student.name : (ev.title || 'שיעור פרטי'))}</span></div>
                              <div class="ev-meta">${money(price)}${ev.status === 'late-cancel' ? ' · ביטול מאוחר (מחויב)' : ''}</div>
                            </div>
                          </div>`;
                }).join('');

                document.getElementById('finDetailBody').innerHTML = `
                        <div class="modal-title">📚 פירוט הכנסות משיעורים</div>
                        <div class="empty-note" style="padding:2px 0 14px;text-align:right;">${MONTHS[m]} ${y} · סה"כ ${money(totalIncome)} מתוך ${held.length} שיעורים</div>
                        <div class="section-title" style="margin-top:0;">סיכום לפי תלמיד/ה</div>
                        ${summaryHtml}
                        <div class="section-title">כל השיעורים</div>
                        ${listHtml || '<div class="empty-note">אין שיעורים שהתקיימו בחודש זה</div>'}
                      `;
                document.getElementById('modalFinanceDetail').classList.add('open');
            }

            /* ---------------- אירועים חוזרים ---------------- */
            function openRecurringManager() {
                renderRecurringList();
                document.getElementById('modalRecurring').classList.add('open');
            }
            function renderRecurringList() {
                const todayStr = toDateStr(new Date());
                const groups = {};
                DATA.events.forEach(ev => {
                    if (!ev.recurringId) return;
                    if (!groups[ev.recurringId]) groups[ev.recurringId] = [];
                    groups[ev.recurringId].push(ev);
                });
                const ids = Object.keys(groups);
                const holder = document.getElementById('recurringBody');
                if (!ids.length) {
                    holder.innerHTML = '<div class="empty-note">אין כרגע אירועים חוזרים מוגדרים 🌸</div>';
                    return;
                }
                holder.innerHTML = ids.map(rid => {
                    const list = groups[rid].sort((a, b) => a.date.localeCompare(b.date));
                    const first = list[0];
                    const meta = TYPE_META[first.type] || TYPE_META.personal;
                    const dowLabel = DOW[parseDateStr(first.date).getDay()];
                    const future = list.filter(e => e.date >= todayStr);
                    const past = list.length - future.length;
                    const student = first.type === 'lesson' && first.clientId ? DATA.clients.find(c => c.id === first.clientId) : null;
                    const nameLine = (first.title ? first.title : meta.label) + (student ? ' · ' + student.name : '');
                    return `<div class="client-card" style="margin-bottom:10px;">
                            <div style="display:flex;align-items:center;gap:8px;">
                              <span class="emo">${meta.icon.replace(/<[^>]+>/g, '')}</span>
                              <div style="flex:1;">
                                <div style="font-weight:700;">${escapeHtml(nameLine)}</div>
                                <div style="font-size:12px;color:var(--text-muted);">כל יום ${dowLabel}' · ${first.startTime}–${first.endTime}</div>
                              </div>
                            </div>
                            <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">${future.length} מופעים עתידיים${past ? ' · ' + past + ' כבר עברו' : ''}</div>
                            <div class="row-btns">
                              <button class="btn btn-danger btn-sm" data-cancel-recurring="${rid}" ${future.length ? '' : 'disabled style="opacity:.5;"'}>ביטול האירוע החוזר מהיום ואילך</button>
                            </div>
                          </div>`;
                }).join('');
                holder.querySelectorAll('[data-cancel-recurring]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const rid = btn.dataset.cancelRecurring;
                        if (!confirm('לבטל את כל המופעים העתידיים של האירוע החוזר הזה (מהיום ואילך)? מופעים שכבר עברו יישארו כמו שהם.')) return;
                        DATA.events = DATA.events.filter(e => !(e.recurringId === rid && e.date >= todayStr));
                        saveData();
                        renderRecurringList();
                        renderSchedule();
                        if (state.view === 'finance') renderFinance();
                    });
                });
            }

            /* ---------------- התראות מקומיות ---------------- */
            // מנגנון תזכורות מקומי - פועל כל עוד הדפדפן/האפליקציה המותקנת רצים.
            function isStandaloneMode() {
                return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            }
            function isIOSDevice() {
                return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
            }
            let deferredInstallPrompt = null;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredInstallPrompt = e;
                const btn = document.getElementById('installAppBtn');
                if (btn) btn.style.display = 'flex';
            });

            function showAppNotification(title, body, tag) {
                const opts = { body: body, icon: './icon-192.png', badge: './icon-192.png', tag: tag, dir: 'rtl', lang: 'he' };
                if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                    navigator.serviceWorker.ready.then(function (reg) {
                        reg.showNotification(title, opts);
                    }).catch(function () {
                        try { new Notification(title, opts); } catch (e) { /* ignore */ }
                    });
                } else {
                    try { new Notification(title, opts); } catch (e) { /* ignore */ }
                }
            }

            function getNotifiedSet() {
                try { return new Set(JSON.parse(localStorage.getItem('hilit_notified_events') || '[]')); }
                catch (e) { return new Set(); }
            }
            function saveNotifiedSet(set) {
                try { localStorage.setItem('hilit_notified_events', JSON.stringify(Array.from(set).slice(-500))); }
                catch (e) { /* ignore */ }
            }

            function checkReminders() {
                if (!storageReady) return;
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const now = new Date();

                if (DATA.settings.notificationsEnabled) {
                    const reminderMs = (DATA.settings.reminderMinutes || 60) * 60000;
                    const notified = getNotifiedSet();
                    DATA.events.forEach(function (ev) {
                        const key = 'ev_' + ev.id;
                        if (notified.has(key)) return;
                        const range = eventRange(ev);
                        const diff = range.start.getTime() - now.getTime();
                        if (diff > 0 && diff <= reminderMs) {
                            const meta = TYPE_META[ev.type] || TYPE_META.personal;
                            let body = ev.title || meta.label;
                            if (ev.type === 'lesson' && ev.clientId) {
                                const c = DATA.clients.find(function (x) { return x.id === ev.clientId; });
                                if (c) body = 'שיעור עם ' + c.name + (c.subject ? ' (' + c.subject + ')' : '');
                            }
                            showAppNotification('עוד ' + Math.round(diff / 60000) + ' דק\' - ' + meta.label, body + ' בשעה ' + ev.startTime, key);
                            notified.add(key);
                            saveNotifiedSet(notified);
                        }
                    });
                }

                if (DATA.settings.morningSummaryEnabled) {
                    const todayStr = toDateStr(now);
                    const lastSummary = localStorage.getItem('hilit_last_summary_date');
                    const parts = (DATA.settings.morningSummaryTime || '07:00').split(':').map(Number);
                    const summaryTime = new Date(now); summaryTime.setHours(parts[0] || 7, parts[1] || 0, 0, 0);
                    if (lastSummary !== todayStr && now.getTime() >= summaryTime.getTime()) {
                        const todays = eventsOnDate(now);
                        let body;
                        if (todays.length === 0) body = 'אין תוכניות להיום 🌸';
                        else body = todays.map(function (e) { return e.startTime + ' - ' + (e.title || TYPE_META[e.type].label); }).join(' | ');
                        showAppNotification('סיכום היום שלך', body, 'morning-summary');
                        try { localStorage.setItem('hilit_last_summary_date', todayStr); } catch (e) { /* ignore */ }
                    }
                }
            }
            setInterval(checkReminders, 30000);
            setInterval(function () {
                autoFinalizeLessons();
                if (state.view === 'finance') renderFinance();
            }, 60000);

            /* ---------------- SETTINGS ---------------- */
            function renderSettings() {

                const holder = document.getElementById('settingsHolder');
