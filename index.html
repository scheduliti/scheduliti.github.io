<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>הלו"ז של הילית</title>
    <link rel="icon" type="image/png" href="./icon-192.png">
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fff4f7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="הלו״ז של הילית">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="preload" as="video" href="./splash.mp4" type="video/mp4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff4f7;
            --glow1: rgba(255, 143, 179, .35);
            --glow2: rgba(196, 148, 255, .22);
            --surface: #ffffff;
            --surface-2: #fff0f5;
            --surface-3: #ffe1ec;
            --border: #f7d6e2;
            --text: #3d1f2e;
            --text-muted: #8c6a79;
            --text-dim: #c1a0af;
            --accent: #e8558a;
            --accent-2: #ff8fb3;
            --accent-soft: rgba(232, 85, 138, .12);
            --ring: rgba(232, 85, 138, .22);
            --accent-ink: #ffffff;
            --shift: #f0813f;
            --shift-bg: rgba(240, 129, 63, .13);
            --lesson: #a05ce0;
            --lesson-bg: rgba(160, 92, 224, .12);
            --personal: #a58a98;
            --personal-bg: rgba(165, 138, 152, .15);
            --holiday-chag: #1fa89a;
            --holiday-chag-bg: rgba(31, 168, 154, .13);
            --holiday-fast: #c2695f;
            --holiday-fast-bg: rgba(194, 105, 95, .13);
            --holiday-memorial: #5f86c4;
            --holiday-memorial-bg: rgba(95, 134, 196, .13);
            --danger: #e0435f;
            --danger-bg: rgba(224, 67, 95, .11);
            --ok: #2fae7f;
            --ok-bg: rgba(47, 174, 127, .13);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow: 0 12px 30px rgba(232, 85, 138, .18);
            --shadow-sm: 0 4px 14px rgba(180, 70, 110, .08);
            --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        html[data-theme="dark"] {
            --bg: #1e1119;
            --glow1: rgba(255, 122, 168, .16);
            --glow2: rgba(160, 92, 224, .16);
            --surface: #2b1a25;
            --surface-2: #35212d;
            --surface-3: #442a3a;
            --border: #4b2f40;
            --text: #fdebf2;
            --text-muted: #cba5b7;
            --text-dim: #8b6b7c;
            --accent: #ff7aa8;
            --accent-2: #ffa3c3;
            --accent-soft: rgba(255, 122, 168, .16);
            --ring: rgba(255, 122, 168, .28);
            --accent-ink: #2a0f1c;
            --shift: #ffa168;
            --shift-bg: rgba(255, 161, 104, .16);
            --lesson: #c78ff7;
            --lesson-bg: rgba(199, 143, 247, .16);
            --personal: #b9a1ae;
            --personal-bg: rgba(185, 161, 174, .16);
            --holiday-chag: #4fd1c1;
            --holiday-chag-bg: rgba(79, 209, 193, .15);
            --holiday-fast: #e58a80;
            --holiday-fast-bg: rgba(229, 138, 128, .15);
            --holiday-memorial: #86a9df;
            --holiday-memorial-bg: rgba(134, 169, 223, .15);
            --danger: #ff6b85;
            --danger-bg: rgba(255, 107, 133, .14);
            --ok: #4fd1a0;
            --ok-bg: rgba(79, 209, 160, .15);
            --shadow: 0 12px 30px rgba(0, 0, 0, .45);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: radial-gradient(520px 320px at 100% -4%, var(--glow1), transparent 70%), radial-gradient(460px 300px at -5% 38%, var(--glow2), transparent 70%), var(--bg);
            background-attachment: fixed;
            color: var(--text);
            font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            overscroll-behavior-y: none;
        }

        button, input, select, textarea {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
        }

            button:active {
                transform: scale(.97);
            }

        input, select, textarea {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            padding: 11px 13px;
            font-size: 14px;
            width: 100%;
            transition: border-color .15s, box-shadow .15s;
        }

            input:focus, select:focus, textarea:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 4px var(--ring);
            }

            input[type=range] {
                padding: 0;
                height: 28px;
                border: 0;
                background: transparent;
                accent-color: var(--accent);
                box-shadow: none;
            }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            margin: 14px 0 6px;
        }

            label:first-child {
                margin-top: 0;
            }

        h1, h2, h3 {
            margin: 0;
            font-weight: 700;
        }

        .emo {
            font-style: normal;
            font-size: 18px;
            line-height: 1;
        }

        .app {
            max-width: 520px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* header */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(to bottom, var(--bg) 70%, transparent);
            padding: 18px 18px 14px;
        }

        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .greet {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.3px;
            line-height: 1.2;
        }

            .greet .name {
                background: var(--grad);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .greet .sub {
                display: block;
                font-size: 12.5px;
                font-weight: 500;
                color: var(--text-muted);
                margin-top: 3px;
                letter-spacing: 0;
            }

        .icon-btn {
            background: var(--surface);
            border: 1.5px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            color: var(--accent);
        }

            .icon-btn svg {
                width: 19px;
                height: 19px;
            }

        main {
            flex: 1;
            padding: 0 16px 120px;
        }

        .view {
            display: none;
            animation: fade .25s ease;
        }

            .view.active {
                display: block;
            }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* segmented control */
        .segmented {
            display: flex;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 4px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

            .segmented button {
                flex: 1;
                background: transparent;
                border: 0;
                padding: 9px 4px;
                border-radius: 14px;
                font-size: 13.5px;
                color: var(--text-muted);
                font-weight: 600;
            }

                .segmented button.active {
                    background: var(--grad);
                    color: var(--accent-ink);
                    box-shadow: 0 4px 12px var(--ring);
                }

        /* date nav */
        .datenav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

            .datenav .label {
                font-size: 16px;
                font-weight: 700;
            }

            .datenav .arrows {
                display: flex;
                gap: 6px;
            }

            .datenav button:not(.btn):not(.today-chip) {
                background: var(--surface);
                border: 1.5px solid var(--border);
                width: 34px;
                height: 34px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--accent);
                box-shadow: var(--shadow-sm);
            }

                .datenav button:not(.btn):not(.today-chip) svg {
                    width: 15px;
                    height: 15px;
                }

        .today-chip {
            background: var(--accent-soft);
            border: 0;
            color: var(--accent);
            font-size: 12.5px;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* week strip */
        .weekstrip {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .chip-holiday {
            font-size: 8px;
            font-weight: 700;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 1px;
        }

        .mc-holiday {
            flex: none;
            font-size: 6.5px;
            font-weight: 700;
            line-height: 1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .holiday-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--cbg);
            border: 1.5px solid var(--c);
            color: var(--c);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
        }

            .holiday-banner svg {
                width: 16px;
                height: 16px;
                flex: none;
            }

        .daychip {
            flex: 1;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 9px 2px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

            .daychip .dow {
                font-size: 10.5px;
                color: var(--text-muted);
            }

            .daychip .num {
                font-size: 16px;
                font-weight: 700;
            }

            .daychip.selected {
                background: var(--grad);
                border-color: transparent;
                color: var(--accent-ink);
                box-shadow: 0 6px 16px var(--ring);
            }

                .daychip.selected .dow {
                    color: var(--accent-ink);
                    opacity: .85;
                }

            .daychip .dots {
                display: flex;
                gap: 2px;
                height: 5px;
            }

                .daychip .dots span {
                    width: 5px;
                    height: 5px;
                    border-radius: 50%;
                }

        /* agenda list */
        .agenda-empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

            .agenda-empty .big {
                font-size: 46px;
                margin-bottom: 10px;
                filter: drop-shadow(0 6px 10px var(--ring));
            }

            .agenda-empty .cta {
                display: inline-block;
                margin-top: 14px;
            }

        .ev-card {
            display: flex;
            gap: 12px;
            background: linear-gradient(to left, var(--cbg), var(--surface) 60%);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 16px;
            margin-bottom: 11px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

            .ev-card::before {
                content: "";
                position: absolute;
                inset-inline-start: 0;
                top: 0;
                bottom: 0;
                width: 5px;
                background: var(--c);
            }

        .ev-time {
            min-width: 52px;
            text-align: center;
        }

            .ev-time .t1 {
                font-weight: 700;
                font-size: 15px;
            }

            .ev-time .t2 {
                font-size: 11.5px;
                color: var(--text-muted);
            }

        .ev-body {
            flex: 1;
            min-width: 0;
        }

        .ev-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .ev-icon {
            flex: none;
            display: inline-flex;
        }

            .ev-icon .emo {
                font-size: 16px;
            }

        .ev-title {
            font-weight: 700;
            font-size: 14.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ev-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .ev-tag {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 20px;
            margin-top: 6px;
            background: var(--cbg);
            color: var(--c);
        }

        .ev-warn {
            margin-top: 6px;
            font-size: 11.5px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

            .ev-warn svg {
                width: 13px;
                height: 13px;
            }

        /* month grid */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 5px;
        }

        .month-dow {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding-bottom: 6px;
            font-weight: 600;
        }

        .month-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative;
        }

            .month-cell.out {
                opacity: .35;
            }

            .month-cell.today {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px var(--ring);
            }

            .month-cell.selected {
                background: var(--grad);
                border-color: transparent;
            }

                .month-cell.selected .mc-num {
                    color: var(--accent-ink);
                }

        .mc-num {
            font-size: 13px;
            line-height: 1.2;
            font-weight: 700;
        }

        .mc-dots {
            flex: none;
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 2px;
            min-height: 4px;
        }

            .mc-dots span {
                width: 4px;
                height: 4px;
                border-radius: 50%;
            }

        /* cards / sections */
        .card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
        }

            .card.hero {
                background: var(--grad);
                border: 0;
                color: var(--accent-ink);
                box-shadow: var(--shadow);
                position: relative;
                overflow: hidden;
            }

                .card.hero::after {
                    content: "🥤";
                    position: absolute;
                    left: 14px;
                    bottom: -8px;
                    font-size: 84px;
                    opacity: .22;
                    transform: rotate(-14deg);
                }

                .card.hero .section-title {
                    color: var(--accent-ink);
                    opacity: .9;
                }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 22px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .section-title:first-child {
                margin-top: 0;
            }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }

            .stat .si {
                font-size: 20px;
                margin-bottom: 4px;
            }

            .stat .num {
                font-size: 22px;
                font-weight: 800;
                font-variant-numeric: tabular-nums;
            }

            .stat .lbl {
                font-size: 11.5px;
                color: var(--text-muted);
                margin-top: 2px;
            }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

            .bar-row:last-child {
                margin-bottom: 0;
            }

            .bar-row .lbl {
                width: 84px;
                font-size: 12px;
                color: var(--text-muted);
                flex: none;
            }

        .bar-track {
            flex: 1;
            height: 12px;
            background: var(--surface-2);
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 8px;
        }

        .bar-row .val {
            width: 70px;
            text-align: left;
            font-size: 12.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex: none;
        }

        /* student card */
        .client-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 15px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }

        .client-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 15px;
            background: var(--grad);
            color: var(--accent-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            flex: none;
            box-shadow: 0 5px 12px var(--ring);
        }

        .client-main {
            flex: 1;
            min-width: 0;
        }

        .client-name {
            font-weight: 700;
            font-size: 15.5px;
        }

        .client-phone {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
        }

        .chip {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--lesson-bg);
            color: var(--lesson);
        }

            .chip.soft {
                background: var(--surface-2);
                color: var(--text-muted);
            }

        .pkg-pill {
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--accent);
            white-space: nowrap;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

            .progress-wrap .pct {
                font-size: 12px;
                font-weight: 700;
                color: var(--accent);
                width: 36px;
                text-align: left;
                font-variant-numeric: tabular-nums;
            }

        .progress {
            flex: 1;
            height: 9px;
            background: var(--surface-3);
            border-radius: 6px;
            overflow: hidden;
        }

            .progress i {
                display: block;
                height: 100%;
                border-radius: 6px;
                background: var(--grad);
            }

        .client-goals {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .prose {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        /* buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 0;
            border-radius: 14px;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 13.5px;
            width: 100%;
        }

            .btn svg {
                width: 16px;
                height: 16px;
            }

        .btn-primary {
            background: var(--grad);
            color: var(--accent-ink);
            box-shadow: 0 6px 16px var(--ring);
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .btn-sm {
            width: auto;
            padding: 9px 14px;
            font-size: 12.5px;
        }

        .row-btns {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

            .row-btns .btn {
                flex: 1;
            }

        /* type picker */
        .type-picker {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 9px;
        }

        .type-opt {
            background: var(--surface-2);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

            .type-opt .emo {
                font-size: 24px;
            }

            .type-opt span {
                font-size: 11.5px;
                font-weight: 700;
            }

            .type-opt.selected {
                border-color: var(--c);
                background: var(--cbg);
            }

        .preset-row {
            display: flex;
            gap: 9px;
        }

        .preset {
            flex: 1;
            background: var(--surface-2);
            border: 2px solid var(--border);

            function renderTicker(items, speed) {
                const box = document.getElementById('ticker'), track = document.getElementById('tickerTrack');
                if (!items.length) { box.classList.remove('on'); track.innerHTML = ''; return; }
                const unit = items.map(m => '<span class="ticker-item">' + escapeHtml(m.text) + '</span><span class="ticker-sep">•</span>').join('');
                box.classList.add('on');
                // מודדים סבב אחד של ההודעות ומכפילים אותו עד שהוא רחב יותר מהמסך
                track.innerHTML = '<div class="ticker-group">' + unit + '</div>';
                const unitW = track.firstElementChild.offsetWidth;
                const reps = Math.max(1, Math.ceil(box.offsetWidth / unitW));
                const group = '<div class="ticker-group">' + unit.repeat(reps) + '</div>';
                track.innerHTML = group + group;
                const w = track.firstElementChild.offsetWidth;
                track.style.setProperty('--dur', Math.max(8, w / speed) + 's');
