<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>הלו"ז של הילית</title>
    <link rel="icon" type="image/png" href="./icon-192.png">
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fff4f7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="הלו״ז של הילית">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff4f7;
            --glow1: rgba(255, 143, 179, .35);
            --glow2: rgba(196, 148, 255, .22);
            --surface: #ffffff;
            --surface-2: #fff0f5;
            --surface-3: #ffe1ec;
            --border: #f7d6e2;
            --text: #3d1f2e;
            --text-muted: #8c6a79;
            --text-dim: #c1a0af;
            --accent: #e8558a;
            --accent-2: #ff8fb3;
            --accent-soft: rgba(232, 85, 138, .12);
            --ring: rgba(232, 85, 138, .22);
            --accent-ink: #ffffff;
            --shift: #f0813f;
            --shift-bg: rgba(240, 129, 63, .13);
            --lesson: #a05ce0;
            --lesson-bg: rgba(160, 92, 224, .12);
            --personal: #a58a98;
            --personal-bg: rgba(165, 138, 152, .15);
            --holiday-chag: #1fa89a;
            --holiday-chag-bg: rgba(31, 168, 154, .13);
            --holiday-fast: #c2695f;
            --holiday-fast-bg: rgba(194, 105, 95, .13);
            --holiday-memorial: #5f86c4;
            --holiday-memorial-bg: rgba(95, 134, 196, .13);
            --danger: #e0435f;
            --danger-bg: rgba(224, 67, 95, .11);
            --ok: #2fae7f;
            --ok-bg: rgba(47, 174, 127, .13);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow: 0 12px 30px rgba(232, 85, 138, .18);
            --shadow-sm: 0 4px 14px rgba(180, 70, 110, .08);
            --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        html[data-theme="dark"] {
            --bg: #1e1119;
            --glow1: rgba(255, 122, 168, .16);
            --glow2: rgba(160, 92, 224, .16);
            --surface: #2b1a25;
            --surface-2: #35212d;
            --surface-3: #442a3a;
            --border: #4b2f40;
            --text: #fdebf2;
            --text-muted: #cba5b7;
            --text-dim: #8b6b7c;
            --accent: #ff7aa8;
            --accent-2: #ffa3c3;
            --accent-soft: rgba(255, 122, 168, .16);
            --ring: rgba(255, 122, 168, .28);
            --accent-ink: #2a0f1c;
            --shift: #ffa168;
            --shift-bg: rgba(255, 161, 104, .16);
            --lesson: #c78ff7;
            --lesson-bg: rgba(199, 143, 247, .16);
            --personal: #b9a1ae;
            --personal-bg: rgba(185, 161, 174, .16);
            --holiday-chag: #4fd1c1;
            --holiday-chag-bg: rgba(79, 209, 193, .15);
            --holiday-fast: #e58a80;
            --holiday-fast-bg: rgba(229, 138, 128, .15);
            --holiday-memorial: #86a9df;
            --holiday-memorial-bg: rgba(134, 169, 223, .15);
            --danger: #ff6b85;
            --danger-bg: rgba(255, 107, 133, .14);
            --ok: #4fd1a0;
            --ok-bg: rgba(79, 209, 160, .15);
            --shadow: 0 12px 30px rgba(0, 0, 0, .45);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: radial-gradient(520px 320px at 100% -4%, var(--glow1), transparent 70%), radial-gradient(460px 300px at -5% 38%, var(--glow2), transparent 70%), var(--bg);
            background-attachment: fixed;
            color: var(--text);
            font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            overscroll-behavior-y: none;
        }

        button, input, select, textarea {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
        }

            button:active {
                transform: scale(.97);
            }

        input, select, textarea {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            padding: 11px 13px;
            font-size: 14px;
            width: 100%;
            transition: border-color .15s, box-shadow .15s;
        }

            input:focus, select:focus, textarea:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 4px var(--ring);
            }

            input[type=range] {
                padding: 0;
                height: 28px;
                border: 0;
                background: transparent;
                accent-color: var(--accent);
                box-shadow: none;
            }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            margin: 14px 0 6px;
        }

            label:first-child {
                margin-top: 0;
            }

        h1, h2, h3 {
            margin: 0;
            font-weight: 700;
        }

        .emo {
            font-style: normal;
            font-size: 18px;
            line-height: 1;
        }

        .app {
            max-width: 520px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* header */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(to bottom, var(--bg) 70%, transparent);
            padding: 18px 18px 14px;
        }

        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .greet {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.3px;
            line-height: 1.2;
        }

            .greet .name {
                background: var(--grad);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .greet .sub {
                display: block;
                font-size: 12.5px;
                font-weight: 500;
                color: var(--text-muted);
                margin-top: 3px;
                letter-spacing: 0;
            }

        .icon-btn {
            background: var(--surface);
            border: 1.5px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            color: var(--accent);
        }

            .icon-btn svg {
                width: 19px;
                height: 19px;
            }

        main {
            flex: 1;
            padding: 0 16px 120px;
        }

        .view {
            display: none;
            animation: fade .25s ease;
        }

            .view.active {
                display: block;
            }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* segmented control */
        .segmented {
            display: flex;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 4px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

            .segmented button {
                flex: 1;
                background: transparent;
                border: 0;
                padding: 9px 4px;
                border-radius: 14px;
                font-size: 13.5px;
                color: var(--text-muted);
                font-weight: 600;
            }

                .segmented button.active {
                    background: var(--grad);
                    color: var(--accent-ink);
                    box-shadow: 0 4px 12px var(--ring);
                }

        /* date nav */
        .datenav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

            .datenav .label {
                font-size: 16px;
                font-weight: 700;
            }

            .datenav .arrows {
                display: flex;
                gap: 6px;
            }

            .datenav button:not(.btn):not(.today-chip) {
                background: var(--surface);
                border: 1.5px solid var(--border);
                width: 34px;
                height: 34px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--accent);
                box-shadow: var(--shadow-sm);
            }

                .datenav button:not(.btn):not(.today-chip) svg {
                    width: 15px;
                    height: 15px;
                }

        .today-chip {
            background: var(--accent-soft);
            border: 0;
            color: var(--accent);
            font-size: 12.5px;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* week strip */
        .weekstrip {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .chip-holiday {
            font-size: 8px;
            font-weight: 700;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 1px;
        }

        .mc-holiday {
            font-size: 6.5px;
            font-weight: 700;
            line-height: 1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .holiday-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--cbg);
            border: 1.5px solid var(--c);
            color: var(--c);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
        }

            .holiday-banner svg {
                width: 16px;
                height: 16px;
                flex: none;
            }

        .daychip {
            flex: 1;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 9px 2px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

            .daychip .dow {
                font-size: 10.5px;
                color: var(--text-muted);
            }

            .daychip .num {
                font-size: 16px;
                font-weight: 700;
            }

            .daychip.selected {
                background: var(--grad);
                border-color: transparent;
                color: var(--accent-ink);
                box-shadow: 0 6px 16px var(--ring);
            }

                .daychip.selected .dow {
                    color: var(--accent-ink);
                    opacity: .85;
                }

            .daychip .dots {
                display: flex;
                gap: 2px;
                height: 5px;
            }

                .daychip .dots span {
                    width: 5px;
                    height: 5px;
                    border-radius: 50%;
                }

        /* agenda list */
        .agenda-empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

            .agenda-empty .big {
                font-size: 46px;
                margin-bottom: 10px;
                filter: drop-shadow(0 6px 10px var(--ring));
            }

            .agenda-empty .cta {
                display: inline-block;
                margin-top: 14px;
            }

        .ev-card {
            display: flex;
            gap: 12px;
            background: linear-gradient(to left, var(--cbg), var(--surface) 60%);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 16px;
            margin-bottom: 11px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

            .ev-card::before {
                content: "";
                position: absolute;
                inset-inline-start: 0;
                top: 0;
                bottom: 0;
                width: 5px;
                background: var(--c);
            }

        .ev-time {
            min-width: 52px;
            text-align: center;
        }

            .ev-time .t1 {
                font-weight: 700;
                font-size: 15px;
            }

            .ev-time .t2 {
                font-size: 11.5px;
                color: var(--text-muted);
            }

        .ev-body {
            flex: 1;
            min-width: 0;
        }

        .ev-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .ev-icon {
            flex: none;
            display: inline-flex;
        }

            .ev-icon .emo {
                font-size: 16px;
            }

        .ev-title {
            font-weight: 700;
            font-size: 14.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ev-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .ev-tag {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 20px;
            margin-top: 6px;
            background: var(--cbg);
            color: var(--c);
        }

        .ev-warn {
            margin-top: 6px;
            font-size: 11.5px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

            .ev-warn svg {
                width: 13px;
                height: 13px;
            }

        /* month grid */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 5px;
        }

        .month-dow {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding-bottom: 6px;
            font-weight: 600;
        }

        .month-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative;
        }

            .month-cell.out {
                opacity: .35;
            }

            .month-cell.today {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px var(--ring);
            }

            .month-cell.selected {
                background: var(--grad);
                border-color: transparent;
            }

                .month-cell.selected .mc-num {
                    color: var(--accent-ink);
                }

        .mc-num {
            font-size: 13px;
            font-weight: 700;
        }

        .mc-dots {
            display: flex;
            gap: 2px;
        }

            .mc-dots span {
                width: 4px;
                height: 4px;
                border-radius: 50%;
            }

        /* cards / sections */
        .card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
        }

        .card.hero {
            background: var(--grad);
            border: 0;
            color: var(--accent-ink);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

            .card.hero::after {
                content: "🥤";
                position: absolute;
                left: 14px;
                bottom: -8px;
                font-size: 84px;
                opacity: .22;
                transform: rotate(-14deg);
            }

            .card.hero .section-title {
                color: var(--accent-ink);
                opacity: .9;
            }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 22px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .section-title:first-child {
                margin-top: 0;
            }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }

            .stat .si {
                font-size: 20px;
                margin-bottom: 4px;
            }

            .stat .num {
                font-size: 22px;
                font-weight: 800;
                font-variant-numeric: tabular-nums;
            }

            .stat .lbl {
                font-size: 11.5px;
                color: var(--text-muted);
                margin-top: 2px;
            }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

            .bar-row:last-child {
                margin-bottom: 0;
            }

            .bar-row .lbl {
                width: 84px;
                font-size: 12px;
                color: var(--text-muted);
                flex: none;
            }

        .bar-track {
            flex: 1;
            height: 12px;
            background: var(--surface-2);
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 8px;
        }

        .bar-row .val {
            width: 70px;
            text-align: left;
            font-size: 12.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex: none;
        }

        /* student card */
        .client-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 15px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }

        .client-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 15px;
            background: var(--grad);
            color: var(--accent-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            flex: none;
            box-shadow: 0 5px 12px var(--ring);
        }

        .client-main {
            flex: 1;
            min-width: 0;
        }

        .client-name {
            font-weight: 700;
            font-size: 15.5px;
        }

        .client-phone {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
        }

        .chip {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--lesson-bg);
            color: var(--lesson);
        }

            .chip.soft {
                background: var(--surface-2);
                color: var(--text-muted);
            }

        .pkg-pill {
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--accent);
            white-space: nowrap;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

            .progress-wrap .pct {
                font-size: 12px;
                font-weight: 700;
                color: var(--accent);
                width: 36px;
                text-align: left;
                font-variant-numeric: tabular-nums;
            }

        .progress {
            flex: 1;
            height: 9px;
            background: var(--surface-3);
            border-radius: 6px;
            overflow: hidden;
        }

            .progress i {
                display: block;
                height: 100%;
                border-radius: 6px;
                background: var(--grad);
            }

        .client-goals {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .prose {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        /* buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 0;
            border-radius: 14px;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 13.5px;
            width: 100%;
        }

            .btn svg {
                width: 16px;
                height: 16px;
            }

        .btn-primary {
            background: var(--grad);
            color: var(--accent-ink);
            box-shadow: 0 6px 16px var(--ring);
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .btn-sm {
            width: auto;
            padding: 9px 14px;
            font-size: 12.5px;
        }

        .row-btns {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

            .row-btns .btn {
                flex: 1;
            }

        /* type picker */
        .type-picker {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 9px;
        }

        .type-opt {
            background: var(--surface-2);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

            .type-opt .emo {
                font-size: 24px;
            }

            .type-opt span {
                font-size: 11.5px;
                font-weight: 700;
            }

            .type-opt.selected {
                border-color: var(--c);
                background: var(--cbg);
            }

        .preset-row {
            display: flex;
            gap: 9px;
        }

        .preset {
            flex: 1;
            background: var(--surface-2);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 10px 6px;
            font-size: 12.5px;
            font-weight: 700;
            line-height: 1.3;
        }

            .preset small {
                display: block;
                font-weight: 500;
                color: var(--text-muted);
                font-size: 11px;
            }

                    let d = parseDateStr(h.start), dayIdx = 1;
                    while (d.getTime() <= end.getTime()) {

            function pad(n) { return String(n).padStart(2, '0'); }
            function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
            function parseDateStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
            function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

            function sameDate(a, b) { return toDateStr(a) === toDateStr(b); }
            function combineDateTime(dateStr, timeStr) {
                const [h, m] = (timeStr || '00:00').split(':').map(Number);
                const d = parseDateStr(dateStr); d.setHours(h, m, 0, 0); return d;
            }
            function eventRange(ev) {
                const start = combineDateTime(ev.date, ev.startTime);

                return { start, end };

            function findConflicts(draftEv, excludeId) {
                const { start: ns, end: ne } = eventRange(draftEv);
                const buf = (draftEv.type !== 'personal' && draftEv.useBuffer !== false) ? DATA.settings.bufferMinutes * 60000 : 0;
                const ps = new Date(ns.getTime() - buf), pe = new Date(ne.getTime() + buf);
                return DATA.events.filter(ev => {
                    if (ev.id === excludeId) return false;
                    const { start: os, end: oe } = eventRange(ev);
                    const obuf = (ev.type !== 'personal' && ev.useBuffer !== false) ? DATA.settings.bufferMinutes * 60000 : 0;
                    const ops = new Date(os.getTime() - obuf), ope = new Date(oe.getTime() + obuf);
                    return ps.getTime() < ope.getTime() && ops.getTime() < pe.getTime();
                });

                        const dotTypes = [...new Set(evs.map(e => e.type))].slice(0, 4);
                        const holiday = getPrimaryHoliday(toDateStr(d));
                        cell.innerHTML = '<span class="mc-num">' + d.getDate() + '</span>' +
                            (holiday
                                ? '<span class="mc-holiday" style="color:' + HOLIDAY_TYPE_META[holiday.type].color + '">' + escapeHtml(holidayLabel(holiday, true)) + '</span>'
                                : '<span class="mc-dots">' + dotTypes.map(t => '<span style="background:' + TYPE_META[t].color + '"></span>').join('') + '</span>');
                        if (holiday && !sameDate(d, state.selectedDate)) {
                            cell.style.background = HOLIDAY_TYPE_META[holiday.type].bg;
                            cell.style.borderColor = HOLIDAY_TYPE_META[holiday.type].color;
                        }
                        cell.addEventListener('click', () => {
                            state.selectedDate = d; state.scheduleMode = 'day';
                            document.querySelectorAll('#scheduleSeg button').forEach(x => x.classList.toggle('active', x.dataset.mode === 'day'));
                            renderSchedule();
                        });
                        grid.appendChild(cell);
                    }
                    document.getElementById('monthGridHolder').appendChild(grid);
                    document.getElementById('holidayHolder').innerHTML = '';
                    document.getElementById('agendaHolder').innerHTML = '';
                }
            }

            function eventsOnDate(d) {
                return DATA.events.filter(ev => {
                    const { start, end } = eventRange(ev);
                    const dayStart = new Date(d); dayStart.setHours(0, 0, 0, 0);
                    const dayEnd = addDays(dayStart, 1);
                    return start.getTime() < dayEnd.getTime() && end.getTime() > dayStart.getTime();
                }).sort((a, b) => a.startTime.localeCompare(b.startTime));
            }

            function renderAgenda(date) {
                const holder = document.getElementById('agendaHolder');
                const evs = eventsOnDate(date);
                if (evs.length === 0) {
                    holder.innerHTML = '<div class="agenda-empty"><div class="big">🍓</div>אין תוכניות ליום הזה<br><button class="btn btn-ghost cta" id="emptyAddBtn" style="width:auto;">הוספת פעילות +</button></div>';
                    document.getElementById('emptyAddBtn').addEventListener('click', () => openEventModal(null, toDateStr(date)));
                    return;
                }
                holder.innerHTML = '';
                evs.forEach(ev => {
                    const meta = TYPE_META[ev.type] || TYPE_META.personal;
                    const conflicts = findConflicts(ev, ev.id);
                    const card = document.createElement('div');
                    card.className = 'ev-card';
                    card.style.setProperty('--c', meta.color);
                    card.style.setProperty('--cbg', meta.bg);
                    const student = ev.clientId ? DATA.clients.find(c => c.id === ev.clientId) : null;
                    let metaLine = '';
                    if (ev.type === 'lesson' && student) metaLine = student.name + (student.subject ? ' · ' + student.subject : '');
                    if (ev.type === 'shift' && ev.commission) metaLine = 'טיפים: ' + money(ev.commission);
                    let warnHtml = '';
                    if (conflicts.length) warnHtml += '<div class="ev-warn">' + ICONS.warn + ' חפיפה עם ' + conflicts.length + ' פעילות/יות</div>';
                    card.innerHTML = '<div class="ev-time"><div class="t1">' + ev.startTime + '</div><div class="t2">' + ev.endTime + '</div></div>' +
                        '<div class="ev-body"><div class="ev-title-row"><span class="ev-icon">' + meta.icon + '</span><span class="ev-title">' + escapeHtml(ev.title || meta.label) + '</span></div>' +
                        (metaLine ? '<div class="ev-meta">' + escapeHtml(metaLine) + '</div>' : '') +
                        '<span class="ev-tag">' + meta.label + '</span>' + warnHtml + '</div>';
                    card.addEventListener('click', () => openEventModal(ev.id));
                    holder.appendChild(card);
                });
            }
            function renderHolidayBanner(dateStr) {
                const holder = document.getElementById('holidayHolder');
                const hol = getPrimaryHoliday(dateStr);
                if (!hol) { holder.innerHTML = ''; return; }
                const meta = HOLIDAY_TYPE_META[hol.type];
                holder.innerHTML = '<div class="holiday-banner" style="--c:' + meta.color + ';--cbg:' + meta.bg + '">' +
                    ICONS.star + '<span>' + escapeHtml(holidayLabel(hol, false)) + ' &nbsp;•&nbsp; ' + meta.label + '</span></div>';
            }

            /* ---------------- EVENT MODAL ---------------- */
            function openEventModal(id, presetDate) {
                state.editingEventId = id;
                const ev = id ? DATA.events.find(e => e.id === id) : null;
                document.getElementById('evModalTitle').textContent = ev ? 'עריכת פעילות' : 'פעילות חדשה';
                const draft = ev ? Object.assign({}, ev) : {
                    id: null, type: 'lesson', title: '', date: presetDate || toDateStr(state.selectedDate),
                    startTime: '16:00', endTime: '17:00', useBuffer: true, notes: '',
                    clientId: '', commission: 0, price: DATA.settings.lessonPrice
                };
                renderEventForm(draft);
                document.getElementById('modalEvent').classList.add('open');
            }
            function closeModal(id) { document.getElementById(id).classList.remove('open'); }
            document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => closeModal(el.dataset.close)));

            function renderEventForm(draft) {
                const body = document.getElementById('evModalBody');
                const students = DATA.clients;
                body.innerHTML = `
                    <div class="type-picker" id="typePicker">
                      ${Object.keys(TYPE_META).map(t => `<button class="type-opt ${draft.type === t ? 'selected' : ''}" data-type="${t}" style="--c:${TYPE_META[t].color};--cbg:${TYPE_META[t].bg}">${TYPE_META[t].icon}<span>${TYPE_META[t].label}</span></button>`).join('')}
                    </div>
                    <label>כותרת (אופציונלי)</label>
                    <input id="f_title" value="${escapeHtml(draft.title || '')}" placeholder="${TYPE_META[draft.type].label}">
                    <div class="field-row">
                      <div><label>תאריך</label><input type="date" id="f_date" value="${draft.date}"></div>
                      <div></div>
                    </div>
                    <div class="field-row">
                      <div><label>שעת התחלה</label><input type="time" id="f_start" value="${draft.startTime}"></div>
                      <div><label>שעת סיום</label><input type="time" id="f_end" value="${draft.endTime}"></div>
                    </div>
                    <div id="typeExtra"></div>
                    <div class="toggle-row">
                      <div><div class="t-main">חסימת זמן נסיעה/התארגנות</div><div class="t-sub">${DATA.settings.bufferMinutes} דק' לפני ואחרי</div></div>
                      <div class="switch ${draft.useBuffer !== false ? 'on' : ''}" id="f_buffer"></div>
                    </div>
                    <label>הערות</label>
                    <textarea id="f_notes" rows="2" placeholder="הערות חופשיות...">${escapeHtml(draft.notes || '')}</textarea>
                    <div id="conflictBox"></div>
                    <div class="row-btns">
                      ${draft.id ? '<button class="btn btn-danger" id="delEvBtn">מחיקה</button>' : ''}
                      <button class="btn btn-primary" id="saveEvBtn">שמירה</button>
                    </div>
                  `;
                document.getElementById('f_buffer').addEventListener('click', function () { this.classList.toggle('on'); refreshConflictPreview(draft); });

                document.querySelectorAll('#typePicker .type-opt').forEach(btn => {
                    btn.addEventListener('click', () => {
                        draft.type = btn.dataset.type;
                        document.querySelectorAll('#typePicker .type-opt').forEach(b => b.classList.toggle('selected', b === btn));
                        document.getElementById('f_title').placeholder = TYPE_META[draft.type].label;
                        renderTypeExtra(draft);
                        refreshConflictPreview(draft);
                    });
                });
                renderTypeExtra(draft);

                ['f_date', 'f_start', 'f_end'].forEach(id => document.getElementById(id).addEventListener('change', () => { updatePresetSel(); refreshConflictPreview(draft); }));
                function updatePresetSel() {
                    const st = document.getElementById('f_start').value, en = document.getElementById('f_end').value;
                    document.querySelectorAll('#shiftPresets .preset').forEach(b => b.classList.toggle('selected', b.dataset.s === st && b.dataset.e === en));
                }

                function renderTypeExtra(d) {
                    const box = document.getElementById('typeExtra');
                    if (d.type === 'shift') {
                        box.innerHTML = `<label>משמרת מהירה (מעדכן את השעות)</label>
                      <div class="preset-row" id="shiftPresets">
                        <button type="button" class="preset" data-s="07:00" data-e="14:00">🌅 משמרת בוקר<small>07:00–14:00</small></button>
                        <button type="button" class="preset" data-s="14:00" data-e="21:00">🌙 משמרת ערב<small>14:00–21:00</small></button>
                      </div>
                      <label>טיפים / בונוס במשמרת (₪)</label><input type="number" id="f_comm" value="${d.commission || 0}" min="0" step="5">`;
                        document.querySelectorAll('#shiftPresets .preset').forEach(b => b.addEventListener('click', () => {
                            document.getElementById('f_start').value = b.dataset.s;
                            document.getElementById('f_end').value = b.dataset.e;
                            updatePresetSel();
                            refreshConflictPreview(d);
                        }));
                        updatePresetSel();
                    } else if (d.type === 'lesson') {
                        box.innerHTML = `<label>תלמיד/ה</label>
                      <select id="f_client"><option value="">— ללא שיוך —</option>${students.map(c => `<option value="${c.id}" ${d.clientId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}${c.subject ? ' (' + escapeHtml(c.subject) + ')' : ''}</option>`).join('')}</select>
                      <label>מחיר השיעור (₪)</label><input type="number" id="f_price" value="${d.price != null ? d.price : DATA.settings.lessonPrice}" min="0" step="5">`;
                    } else {
                        box.innerHTML = '';
                    }
                }

                function refreshConflictPreview(d) {
                    const test = {
                        id: d.id, type: d.type, date: document.getElementById('f_date').value,
                        startTime: document.getElementById('f_start').value, endTime: document.getElementById('f_end').value,
                        useBuffer: document.getElementById('f_buffer').classList.contains('on')
                    };
                    const box = document.getElementById('conflictBox');
                    if (!test.date || !test.startTime || !test.endTime) { box.innerHTML = ''; return; }
                    const conflicts = findConflicts(test, d.id);
                    let html = '';
                    if (conflicts.length) {
                        html += '<div class="alert">' + ICONS.warn + '<div><b>זוהתה חפיפה</b>חופפת ל' + conflicts.map(c => TYPE_META[c.type].label + ' (' + c.startTime + '–' + c.endTime + ')').join(', ') + (test.useBuffer ? ' (כולל זמן חוצץ)' : '') + '</div></div>';
                    }
                    box.innerHTML = html;
                }
                refreshConflictPreview(draft);

                document.getElementById('saveEvBtn').addEventListener('click', () => {
                    draft.title = document.getElementById('f_title').value.trim();
                    draft.date = document.getElementById('f_date').value;
                    draft.startTime = document.getElementById('f_start').value;
                    draft.endTime = document.getElementById('f_end').value;
                    draft.useBuffer = document.getElementById('f_buffer').classList.contains('on');
                    draft.notes = document.getElementById('f_notes').value.trim();
                    if (draft.type === 'shift') { draft.commission = parseFloat(document.getElementById('f_comm').value) || 0; }
                    if (draft.type === 'lesson') {
                        draft.clientId = document.getElementById('f_client').value || '';
                        const p = parseFloat(document.getElementById('f_price').value);
                        draft.price = isNaN(p) ? DATA.settings.lessonPrice : p;
                    }
                    if (!draft.date || !draft.startTime || !draft.endTime) { alert('נא למלא תאריך ושעות'); return; }
                    if (draft.id) {
                        const idx = DATA.events.findIndex(e => e.id === draft.id);
                        DATA.events[idx] = draft;
                    } else {
                        draft.id = uid();
                        if (draft.type === 'lesson') draft.status = 'scheduled';
                        DATA.events.push(draft);
                    }
                    saveData();
                    closeModal('modalEvent');
                    renderSchedule();
                    if (state.view === 'finance') renderFinance();
                });
                if (draft.id) {
                    document.getElementById('delEvBtn').addEventListener('click', () => {
                        if (confirm('למחוק את הפעילות?')) {
                            DATA.events = DATA.events.filter(e => e.id !== draft.id);
                            saveData(); closeModal('modalEvent'); renderSchedule();
                        }
                    });
                }
            }

            /* ---------------- STUDENTS ---------------- */
            function lessonsDone(c) {
                return (c.history || []).filter(h => h.status === 'attended' || h.status === 'late-cancel').length;
            }

            function renderClients() {
                const holder = document.getElementById('clientsHolder');
                if (DATA.clients.length === 0) {
                    holder.innerHTML = '<div class="agenda-empty"><div class="big">📚</div><div>עדיין אין תלמידים רשומים<br>הוספת תלמיד/ה תאפשר מעקב אחרי התקדמות ושיעורים</div></div>';
                    return;
                }
                holder.innerHTML = '';
                DATA.clients.forEach(c => {
                    const prog = Math.max(0, Math.min(100, c.progress || 0));
                    const div = document.createElement('div');
                    div.className = 'client-card';
                    const chips = (c.subject ? '<span class="chip">' + escapeHtml(c.subject) + '</span>' : '') + (c.age ? '<span class="chip soft">גיל ' + escapeHtml(c.age) + '</span>' : '');
                    div.innerHTML = `<div class="client-top">
                      <div class="avatar">${escapeHtml((c.name || '?').trim().charAt(0))}</div>
                      <div class="client-main"><div class="client-name">${escapeHtml(c.name)}</div>${chips ? '<div class="chips">' + chips + '</div>' : ''}</div>
                      <span class="pkg-pill">${lessonsDone(c)} שיעורים</span>
                    </div>
                    <div class="progress-wrap"><div class="progress"><i style="width:${prog}%"></i></div><span class="pct">${prog}%</span></div>
                    ${c.learned ? '<div class="client-goals">📖 ' + escapeHtml(c.learned) + '</div>' : ''}`;
                    div.addEventListener('click', () => openClientDetail(c.id));
                    holder.appendChild(div);
                });
            }

            function openClientModal(id) {
                state.editingClientId = id;
                const c = id ? DATA.clients.find(x => x.id === id) : null;
                document.getElementById('clModalTitle').textContent = c ? 'עריכת תלמיד/ה' : 'תלמיד/ה חדש/ה';
                const draft = c ? Object.assign({}, c) : { id: null, name: '', phone: '', subject: '', age: '', progress: 0, learned: '', notes: '', history: [] };
                document.getElementById('clModalBody').innerHTML = `
                    <label>שם מלא</label><input id="c_name" value="${escapeHtml(draft.name)}">
                    <div class="field-row">
                      <div><label>מקצוע</label><input id="c_subject" value="${escapeHtml(draft.subject || '')}" placeholder="למשל: מתמטיקה"></div>
                      <div style="flex:.6"><label>גיל</label><input id="c_age" type="number" min="1" max="99" value="${escapeHtml(draft.age || '')}"></div>
                    </div>
                    <label>טלפון (תלמיד/ה או הורה)</label><input id="c_phone" value="${escapeHtml(draft.phone || '')}" type="tel">
                    <label>התקדמות: <b id="c_prog_val" style="color:var(--accent)">${draft.progress || 0}%</b></label>
                    <input id="c_prog" type="range" min="0" max="100" step="5" value="${draft.progress || 0}">
                    <label>מה למדו עד כה</label><textarea id="c_learned" rows="4" placeholder="נושאים, פרקים, מיומנויות שכבר נלמדו...">${escapeHtml(draft.learned || '')}</textarea>
                    <label>הערות</label><textarea id="c_notes" rows="2" placeholder="קשיים, סגנון למידה, דברים לזכור...">${escapeHtml(draft.notes || '')}</textarea>
                    <div class="row-btns">
                      ${draft.id ? '<button class="btn btn-danger" id="delClBtn">מחיקה</button>' : ''}
                      <button class="btn btn-primary" id="saveClBtn">שמירה</button>
                    </div>`;
                document.getElementById('c_prog').addEventListener('input', e => { document.getElementById('c_prog_val').textContent = e.target.value + '%'; });
                document.getElementById('saveClBtn').addEventListener('click', () => {
                    draft.name = document.getElementById('c_name').value.trim();
                    if (!draft.name) { alert('נא להזין שם'); return; }
                    draft.subject = document.getElementById('c_subject').value.trim();
                    const age = parseInt(document.getElementById('c_age').value);
                    draft.age = isNaN(age) ? '' : age;
                    draft.phone = document.getElementById('c_phone').value.trim();
                    draft.progress = parseInt(document.getElementById('c_prog').value) || 0;
                    draft.learned = document.getElementById('c_learned').value.trim();
                    draft.notes = document.getElementById('c_notes').value.trim();
                    draft.history = draft.history || [];
                    if (draft.id) { const idx = DATA.clients.findIndex(x => x.id === draft.id); DATA.clients[idx] = draft; }
                    else { draft.id = uid(); DATA.clients.push(draft); }
                    saveData(); closeModal('modalClient'); renderClients();
                });
                if (draft.id) {
                    document.getElementById('delClBtn').addEventListener('click', () => {
                        if (confirm('למחוק את התלמיד/ה? (השיעורים המשויכים יישארו ביומן ללא שיוך)')) {
                            DATA.clients = DATA.clients.filter(x => x.id !== draft.id);
                            DATA.events.forEach(e => { if (e.clientId === draft.id) e.clientId = ''; });
                            saveData(); closeModal('modalClient'); renderClients();
                        }
                    });
                }
                document.getElementById('modalClient').classList.add('open');
            }

            function openClientDetail(id) {
                state.detailClientId = id;
                const c = DATA.clients.find(x => x.id === id);
                if (!c) return;
                const prog = Math.max(0, Math.min(100, c.progress || 0));
                const todayStart = new Date(new Date().setHours(0, 0, 0, 0));
                const upcoming = DATA.events.filter(e => e.type === 'lesson' && e.clientId === id && e.status === 'scheduled' && parseDateStr(e.date) >= todayStart).sort((a, b) => a.date.localeCompare(b.date));
                const history = (c.history || []).slice().reverse();
                const chips = (c.subject ? '<span class="chip">' + escapeHtml(c.subject) + '</span>' : '') + (c.age ? '<span class="chip soft">גיל ' + escapeHtml(c.age) + '</span>' : '') + (c.phone ? '<span class="chip soft">' + escapeHtml(c.phone) + '</span>' : '');
                document.getElementById('clDetailBody').innerHTML = `
                    <div class="modal-title">${escapeHtml(c.name)}</div>
                    ${chips ? '<div class="chips" style="margin:0 0 12px;">' + chips + '</div>' : ''}
                    <div class="stat-grid" style="margin:12px 0;">
                      <div class="stat"><div class="si">✏️</div><div class="num">${lessonsDone(c)}</div><div class="lbl">שיעורים שהתקיימו</div></div>
                      <div class="stat"><div class="si">🌱</div><div class="num">${prog}%</div><div class="lbl">התקדמות</div>
                        <div class="progress" style="margin-top:8px;"><i style="width:${prog}%"></i></div></div>
                    </div>
                    ${c.learned ? '<div class="section-title">📖 מה למדו עד כה</div><div class="prose">' + escapeHtml(c.learned) + '</div>' : ''}
                    ${c.notes ? '<div class="section-title">📝 הערות</div><div class="prose">' + escapeHtml(c.notes) + '</div>' : ''}
                    <div class="section-title">שיעורים קרובים</div>
                    ${upcoming.length ? upcoming.map(e => `<div class="ev-card" style="--c:${TYPE_META.lesson.color};--cbg:${TYPE_META.lesson.bg}"><div class="ev-time"><div class="t1">${e.startTime}</div><div class="t2">${e.date.slice(5)}</div></div>
                      <div class="ev-body"><div class="ev-title">${escapeHtml(e.title || 'שיעור פרטי')}</div>
                      <div class="row-btns">
                        <button class="btn btn-ghost btn-sm" data-checkin="${e.id}">${ICONS.check} התקיים</button>
                        <button class="btn btn-danger btn-sm" data-cancel="${e.id}">ביטול</button>
                      </div></div></div>`).join('') : '<div class="empty-note">אין שיעורים עתידיים מתוזמנים</div>'}
                    <div class="section-title">היסטוריה</div>
                    ${history.length ? history.slice(0, 10).map(h => `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
                      <span>${h.date}</span><span style="font-weight:600;color:${h.status === 'attended' ? 'var(--ok)' : 'var(--danger)'}">${h.status === 'attended' ? 'התקיים' : h.status === 'late-cancel' ? 'ביטול מאוחר (מחויב)' : 'בוטל'}</span></div>`).join('') : '<div class="empty-note">אין היסטוריה עדיין</div>'}
                    <div class="row-btns">
                      <button class="btn btn-ghost" id="editClFromDetail">עריכת פרטים</button>
                    </div>
                  `;
                document.getElementById('editClFromDetail').addEventListener('click', () => { closeModal('modalClientDetail'); openClientModal(id); });
                document.querySelectorAll('[data-checkin]').forEach(b => b.addEventListener('click', () => markLesson(b.dataset.checkin, 'attended')));
                document.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => {
                    const late = confirm('האם זהו ביטול מאוחר (השיעור יחויב)? אישור = כן, ביטול = לא');
                    markLesson(b.dataset.cancel, late ? 'late-cancel' : 'cancelled');
                }));
                document.getElementById('modalClientDetail').classList.add('open');
            }
            function markLesson(eventId, status) {
                const ev = DATA.events.find(e => e.id === eventId);
                if (!ev) return;
                ev.status = status;
                const c = DATA.clients.find(x => x.id === ev.clientId);
                if (c) {
                    c.history = c.history || [];
                    c.history.push({ id: uid(), date: ev.date, status, eventId });
                }
                saveData();
                if (ev.clientId) openClientDetail(ev.clientId);
                renderClients();
                renderSchedule();
            }
            // שיעור שהסתיים ועדיין "מתוזמן" נחשב אוטומטית כשיעור שהתקיים
            function autoFinalizeLessons() {
                if (!storageReady || writeDenied) return;
                const now = new Date();
                let changed = false;
                DATA.events.forEach(ev => {
                    if (ev.type === 'lesson' && ev.status === 'scheduled') {
                        const { end } = eventRange(ev);
                        if (end.getTime() <= now.getTime()) {
                            ev.status = 'attended';
                            const c = DATA.clients.find(x => x.id === ev.clientId);
                            if (c) {
                                c.history = c.history || [];
                                c.history.push({ id: uid(), date: ev.date, status: 'attended', eventId: ev.id });
                            }
                            changed = true;
                        }
                    }
                });
                if (changed) {
                    saveDataToFirebase(true);
                    renderSchedule();
                    renderClients();
                    if (state.view === 'finance') renderFinance();
                }
            }

            /* ---------------- FINANCE ---------------- */
            document.getElementById('finPrev').addEventListener('click', () => { const d = new Date(state.financeMonth); d.setMonth(d.getMonth() - 1); state.financeMonth = d; renderFinance(); });
            document.getElementById('finNext').addEventListener('click', () => { const d = new Date(state.financeMonth); d.setMonth(d.getMonth() + 1); state.financeMonth = d; renderFinance(); });

            function renderFinance() {
                const y = state.financeMonth.getFullYear(), m = state.financeMonth.getMonth();
                document.getElementById('finLabel').textContent = MONTHS[m] + ' ' + y;
                const inMonth = DATA.events.filter(e => { const d = parseDateStr(e.date); return d.getFullYear() === y && d.getMonth() === m; });

                const now = new Date();
                let shiftHours = 0, tips = 0, lessonsHeld = 0, lessonsTotal = 0, lessonIncome = 0, lessonHours = 0;
                inMonth.forEach(ev => {
                    const { start, end } = eventRange(ev);
                    const hrs = (end - start) / 3600000;
                    const isDone = end.getTime() <= now.getTime();
                    if (ev.type === 'shift' && isDone) { shiftHours += hrs; tips += (ev.commission || 0); }
                    if (ev.type === 'lesson') {
                        lessonsTotal++;
                        if (ev.status === 'attended' || ev.status === 'late-cancel') {
                            lessonsHeld++;
                            lessonIncome += (ev.price != null ? ev.price : DATA.settings.lessonPrice);
                            lessonHours += hrs;
                        }
                    }
                });
                const shiftIncome = shiftHours * DATA.settings.shiftHourlyRate + tips;
                const totalIncome = shiftIncome + lessonIncome;

                document.getElementById('financeHolder').innerHTML = `
                    <div class="card hero">
                      <div class="section-title" style="margin-top:0;">סה"כ הכנסה החודש</div>
                      <div style="font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;">${money(totalIncome)}</div>
                    </div>
                    <div class="stat-grid">
                      <div class="stat"><div class="si">🥤</div><div class="num">${money(shiftIncome)}</div><div class="lbl">הכנסה ממיציפי</div></div>
                      <div class="stat"><div class="si">📚</div><div class="num">${money(lessonIncome)}</div><div class="lbl">הכנסה משיעורים</div></div>
                      <div class="stat"><div class="si">⏰</div><div class="num">${shiftHours.toFixed(1)}</div><div class="lbl">שעות במיציפי</div></div>
                      <div class="stat"><div class="si">✏️</div><div class="num">${lessonsHeld}/${lessonsTotal}</div><div class="lbl">שיעורים שבוצעו</div></div>
                      <div class="stat"><div class="si">🎓</div><div class="num">${lessonHours.toFixed(1)}</div><div class="lbl">שעות הוראה</div></div>
                      <div class="stat"><div class="si">🍓</div><div class="num">${money(tips)}</div><div class="lbl">טיפים / בונוסים</div></div>
                    </div>
                    <div class="section-title">פילוח הכנסה</div>
                    <div class="card">
                      ${financeBar('מיציפי 🥤', shiftIncome, totalIncome || 1, 'var(--shift)', true)}
                      ${financeBar('שיעורים 📚', lessonIncome, totalIncome || 1, 'var(--lesson)', true)}
                    </div>
                    <div class="section-title">חלוקת שעות</div>
                    <div class="card">
                      ${financeBar('מיציפי 🥤', shiftHours, (shiftHours + lessonHours) || 1, 'var(--shift)', false)}
                      ${financeBar('הוראה 📚', lessonHours, (shiftHours + lessonHours) || 1, 'var(--lesson)', false)}
                    </div>
                  `;
            }
            function financeBar(label, val, total, color, isMoney) {
                const pct = val > 0 ? Math.max(2, Math.min(100, (val / total) * 100)) : 0;
                return `<div class="bar-row"><span class="lbl">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="val">${isMoney ? money(val) : val.toFixed(1) + ' שע\''}</span></div>`;
            }

            /* ---------------- התראות מקומיות ---------------- */
            // מנגנון תזכורות מקומי - פועל כל עוד הדפדפן/האפליקציה המותקנת רצים.
            function isStandaloneMode() {
                return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            }
            function isIOSDevice() {
                return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
            }
            let deferredInstallPrompt = null;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredInstallPrompt = e;
                const btn = document.getElementById('installAppBtn');
                if (btn) btn.style.display = 'flex';
            });

            function showAppNotification(title, body, tag) {
                const opts = { body: body, icon: './icon-192.png', badge: './icon-192.png', tag: tag, dir: 'rtl', lang: 'he' };
                if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                    navigator.serviceWorker.ready.then(function (reg) {
                        reg.showNotification(title, opts);
                    }).catch(function () {
                        try { new Notification(title, opts); } catch (e) { /* ignore */ }
                    });
                } else {
                    try { new Notification(title, opts); } catch (e) { /* ignore */ }
                }
            }

            function getNotifiedSet() {
                try { return new Set(JSON.parse(localStorage.getItem('hilit_notified_events') || '[]')); }
                catch (e) { return new Set(); }
            }
            function saveNotifiedSet(set) {
                try { localStorage.setItem('hilit_notified_events', JSON.stringify(Array.from(set).slice(-500))); }
                catch (e) { /* ignore */ }
            }

            function checkReminders() {
                if (!storageReady) return;
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const now = new Date();

                if (DATA.settings.notificationsEnabled) {
                    const reminderMs = (DATA.settings.reminderMinutes || 60) * 60000;
                    const notified = getNotifiedSet();
                    DATA.events.forEach(function (ev) {
                        const key = 'ev_' + ev.id;
                        if (notified.has(key)) return;
                        const range = eventRange(ev);
                        const diff = range.start.getTime() - now.getTime();
                        if (diff > 0 && diff <= reminderMs) {
                            const meta = TYPE_META[ev.type] || TYPE_META.personal;
                            let body = ev.title || meta.label;
                            if (ev.type === 'lesson' && ev.clientId) {
                                const c = DATA.clients.find(function (x) { return x.id === ev.clientId; });
                                if (c) body = 'שיעור עם ' + c.name + (c.subject ? ' (' + c.subject + ')' : '');
                            }
                            showAppNotification('עוד ' + Math.round(diff / 60000) + ' דק\' - ' + meta.label, body + ' בשעה ' + ev.startTime, key);
                            notified.add(key);
                            saveNotifiedSet(notified);
                        }
                    });
                }

                if (DATA.settings.morningSummaryEnabled) {
                    const todayStr = toDateStr(now);
                    const lastSummary = localStorage.getItem('hilit_last_summary_date');
                    const parts = (DATA.settings.morningSummaryTime || '07:00').split(':').map(Number);
                    const summaryTime = new Date(now); summaryTime.setHours(parts[0] || 7, parts[1] || 0, 0, 0);
                    if (lastSummary !== todayStr && now.getTime() >= summaryTime.getTime()) {
                        const todays = eventsOnDate(now);
                        let body;
                        if (todays.length === 0) body = 'אין תוכניות להיום 🌸';
                        else body = todays.map(function (e) { return e.startTime + ' - ' + (e.title || TYPE_META[e.type].label); }).join(' | ');
                        showAppNotification('סיכום היום שלך', body, 'morning-summary');
                        try { localStorage.setItem('hilit_last_summary_date', todayStr); } catch (e) { /* ignore */ }
                    }
                }
            }
            setInterval(checkReminders, 30000);
            setInterval(function () {
                autoFinalizeLessons();
                if (state.view === 'finance') renderFinance();
            }, 60000);

            /* ---------------- SETTINGS ---------------- */
            function renderSettings() {
                const s = DATA.settings;
                const holder = document.getElementById('settingsHolder');
                const notifSupported = ('Notification' in window);
                const permStatus = notifSupported ? Notification.permission : 'unsupported';
                let permNote = '';
                if (!notifSupported) permNote = 'הדפדפן הזה לא תומך בהתראות.';
                else if (permStatus === 'granted') permNote = 'הרשאת התראות ניתנה ✓';
                else if (permStatus === 'denied') permNote = 'ההתראות חסומות ברמת הדפדפן/המכשיר. יש לאפשר זאת ידנית בהגדרות המכשיר כדי שהתזכורות יעבדו.';
                else permNote = 'יש להפעיל את המתג כדי לאשר קבלת התראות מהדפדפן.';

                holder.innerHTML = `
                    <div class="section-title" style="margin-top:0;">💰 תעריפים</div>
                    <div class="card">
                      <label>תעריף שעתי – משמרת במיציפי (₪)</label><input type="number" id="s_rate" value="${s.shiftHourlyRate}" step="0.1">
                      <label>מחיר שיעור פרטי (₪)</label><input type="number" id="s_price" value="${s.lessonPrice}" step="5">
                    </div>
                    <div class="section-title">⏱️ מרווחים</div>
                    <div class="card">
                      <label>זמן נסיעה/התארגנות בין פעילויות (דקות)</label><input type="number" id="s_buffer" value="${s.bufferMinutes}" step="5">
                    </div>
                    <div class="section-title">🔔 התראות ותזכורות</div>
                    <div class="card">
                      <div class="toggle-row">
                        <div><div class="t-main">תזכורות לפני פעילות</div><div class="t-sub">התראה בדפדפן/באפליקציה המותקנת לפני כל פעילות</div></div>
                        <div class="switch ${s.notificationsEnabled ? 'on' : ''}" id="s_notif"></div>
                      </div>
                      <label>כמה דקות לפני להתריע</label><input type="number" id="s_remind_min" value="${s.reminderMinutes || 60}" min="5" step="5">
                      <div class="toggle-row">
                        <div><div class="t-main">סיכום בוקר יומי</div><div class="t-sub">התראה יומית עם רשימת הפעילויות של היום</div></div>
                        <div class="switch ${s.morningSummaryEnabled ? 'on' : ''}" id="s_morning"></div>
                      </div>
                      <label>שעת סיכום בוקר</label><input type="time" id="s_morning_time" value="${s.morningSummaryTime || '07:00'}">
                      <div class="alert soft">${ICONS.bell}<div><b>סטטוס הרשאה</b>${permNote}</div></div>
                      <div class="alert soft">${ICONS.warn}<div><b>לתשומת לבך</b>התראות אלו פועלות כל עוד הדפדפן פתוח, או ברקע אם התקנת את האפליקציה למסך הבית. התראות שמגיעות גם כשהאפליקציה סגורה לחלוטין דורשות שרת דחיפה ייעודי ואינן זמינות בגרסה הזו.</div></div>
                    </div>
                    <div class="section-title">🎨 כללי</div>
                    <div class="card">
                      <div class="toggle-row"><div><div class="t-main">מצב כהה</div><div class="t-sub">עיצוב רך לעיניים בשעות החשכה</div></div>
                        <div class="switch ${s.theme === 'dark' ? 'on' : ''}" id="s_theme"></div></div>
                    </div>
                    <div class="section-title">📲 התקנה ומצב לא-מקוון</div>
                    <div class="card">
                      <div class="empty-note" style="padding:6px 0 12px;text-align:right;">התקנת האפליקציה למסך הבית מאפשרת פתיחה מהירה כמו אפליקציה רגילה, ועובדת גם עם קליטה חלשה - הנתונים יסתנכרנו אוטומטית ברגע שהאינטרנט יחזור.</div>
                     <button class="btn btn-ghost" id="installAppBtn" style="display:${isStandaloneMode() ? 'none' : 'flex'};margin-bottom:8px;">${ICONS.download} התקנת האפליקציה על המכשיר</button>
                    </div>
                    <div class="section-title">🗓️ סנכרון יומן</div>
                    <div class="card">
                      <div class="empty-note" style="padding:6px 0 12px;text-align:right;">אפשר לייצא את הלו"ז כקובץ ICS ולייבא אותו ידנית ליומן של Google / Apple.</div>
                      <button class="btn btn-ghost" id="exportIcsBtn">ייצוא ICS</button>
                    </div>
                    <div class="section-title">נתונים</div>
                    <div class="card">
                      <button class="btn btn-danger" id="resetBtn">${ICONS.trash} איפוס כל הנתונים</button>
                    </div>
                    <div class="empty-note">הנתונים נשמרים באופן פרטי בחשבון שלך בלבד 🌷</div>
                  `;
                document.getElementById('s_theme').addEventListener('click', function () {
                    this.classList.toggle('on');
                    s.theme = this.classList.contains('on') ? 'dark' : 'light';
                    applyTheme(); saveData();
                });
                ['s_rate', 's_price', 's_buffer'].forEach(id => {
                    document.getElementById(id).addEventListener('change', e => {
                        const map = { s_rate: 'shiftHourlyRate', s_price: 'lessonPrice', s_buffer: 'bufferMinutes' };
                        s[map[id]] = parseFloat(e.target.value) || 0;
                        saveData();
                    });
                });

                function bindNotifSwitch(elId, key) {
                    document.getElementById(elId).addEventListener('click', function () {
                        const sw = this;
                        if (!sw.classList.contains('on')) {
                            if (!notifSupported) { alert('הדפדפן הזה לא תומך בהתראות'); return; }
                            Notification.requestPermission().then(function (perm) {
                                if (perm === 'granted') {
                                    sw.classList.add('on');
                                    s[key] = true;
                                } else {
                                    s[key] = false;
                                    alert('לא ניתנה הרשאה להתראות. יש לאפשר זאת בהגדרות הדפדפן/המכשיר.');
                                }
                                saveData(); renderSettings();
                            });
                        } else {
                            sw.classList.remove('on');
                            s[key] = false;
                            saveData();
                        }
                    });
                }
                bindNotifSwitch('s_notif', 'notificationsEnabled');
                bindNotifSwitch('s_morning', 'morningSummaryEnabled');
                document.getElementById('s_remind_min').addEventListener('change', e => { s.reminderMinutes = parseInt(e.target.value) || 60; saveData(); });
                document.getElementById('s_morning_time').addEventListener('change', e => { s.morningSummaryTime = e.target.value || '07:00'; saveData(); });

                const installBtn = document.getElementById('installAppBtn');
                if (installBtn) {
                    installBtn.addEventListener('click', function () {
                        if (deferredInstallPrompt) {
                            deferredInstallPrompt.prompt();
                            deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; });
                        } else if (isIOSDevice()) {
                            alert('כדי להתקין באייפון/אייפד: לחצי על כפתור השיתוף (Share) בסרגל של ספארי, ואז "הוספה למסך הבית".');
                        } else {
                            alert('כדי להתקין: פתחי את תפריט הדפדפן (שלוש נקודות למעלה) ובחרי "התקנת אפליקציה" או "הוספה למסך הבית".');
                        }
                    });
                }

                document.getElementById('resetBtn').addEventListener('click', () => {
                    if (confirm('פעולה זו תמחק את כל האירועים, התלמידים וההגדרות. להמשיך?')) {
                        DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
                        saveData(); applyTheme(); renderAll();
                    }
                });
                document.getElementById('exportIcsBtn').addEventListener('click', exportIcs);
            }

            function exportIcs() {
                let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//הלוז של הילית//HE\r\n';
                DATA.events.forEach(ev => {
                    const { start, end } = eventRange(ev);
                    const fmt = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
                    ics += 'BEGIN:VEVENT\r\nUID:' + ev.id + '@hilit-schedule\r\nDTSTART:' + fmt(start) + '\r\nDTEND:' + fmt(end) + '\r\nSUMMARY:' + (ev.title || TYPE_META[ev.type].label) + '\r\nEND:VEVENT\r\n';
                });
                ics += 'END:VCALENDAR';
                const blob = new Blob([ics], { type: 'text/calendar' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'schedule.ics';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            /* ---------------- INIT ---------------- */
            function renderAll() {
                autoFinalizeLessons();
                updateGreeting();
                setActiveView(state.view);
                renderSchedule();
                renderClients();
                renderFinance();
                renderSettings();
                checkReminders();
            }
            updateGreeting();
            setActiveView('schedule');
        })();
    </script>
</body>
</html>
